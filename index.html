た日の翌日から原則1か月以内にしなければならない。","再審査請求の客観的期間は10年である。","再審査請求は裁判所に対して行う。","再審査請求では正当な理由による期間例外は認められない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行審法62条。主観1か月、客観1年。いずれも正当理由例外あり。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-16","mock":"mock3","no":16,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"証拠・物件提出","stem":"審査請求の証拠調べについて、妥当なものはどれか。","choices":["審査請求人や参加人は証拠書類・証拠物を提出できない。","審理員は物件提出を職権で求めることができない。","審理員は、申立てまたは職権で、物件所持人に提出を求め、提出物を留め置くことができる。","処分庁等は処分理由を証する書類を提出できない。","行政不服審査法には証拠調べの規定がない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"行審法32条・33条。証拠提出、物件提出要求等の審理手続がある。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"やや難","category":"薄出"},{"id":"MOCK3-17","mock":"mock3","no":17,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"当事者訴訟","stem":"当事者訴訟について、妥当なものはどれか。","choices":["公法上の法律関係に関する確認の訴えは当事者訴訟となる余地がない。","当事者訴訟は必ず行政処分の取消しを求める訴えである。","公法上の法律関係に関する確認の訴えその他の公法上の法律関係に関する訴訟は実質的当事者訴訟となり得る。","当事者訴訟には民事訴訟法が一切準用されない。","当事者訴訟には国・地方公共団体を被告とするものは存在しない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"行訴法4条。当事者訴訟には形式的当事者訴訟と実質的当事者訴訟がある。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-18","mock":"mock3","no":18,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"民衆訴訟・機関訴訟","stem":"民衆訴訟・機関訴訟について、妥当なものはどれか。","choices":["民衆訴訟は自己の法律上の利益を侵害された者だけが提起できる主観訴訟である。","民衆訴訟および機関訴訟は、法律に定める場合に限って提起できる。","機関訴訟は私人間の契約紛争を解決する訴訟である。","住民訴訟は機関訴訟に分類される。","地方議員選挙の効力を争う訴えは通常の取消訴訟である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"客観訴訟である民衆訴訟・機関訴訟は法定主義。住民訴訟は民衆訴訟。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-19","mock":"mock3","no":19,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"争点訴訟","stem":"行政処分の効力が民事訴訟の争点となる場合に関する次の記述のうち、妥当なものはどれか。","choices":["行政処分の効力を前提問題として争う民事訴訟は一切認められない。","処分の効力を争点とする民事訴訟について、行訴法は取消訴訟の一部規定を準用している。","民事訴訟で処分の無効を主張するには必ず先に取消判決を得る必要がある。","争点訴訟の被告は常に処分庁である。","争点訴訟では関係行政庁を参加させる制度はない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行訴法45条。私法上の訴訟で処分の存否・効力が争点となる場合の特則がある。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"難","category":"長期空白"},{"id":"MOCK3-20","mock":"mock3","no":20,"format":"5肢択一","section":"法令等","subject":"国家賠償法","field":"外国人・相互保証","stem":"外国人の国家賠償請求について、妥当なものはどれか。","choices":["外国人には国家賠償法は一切適用されない。","国家賠償法6条は、外国人について相互保証がある場合に限り同法を適用する旨を定める。","外国人の国家賠償請求には日本国籍取得が必要である。","相互保証は刑法にのみ定められる。","外国人には国家賠償法2条だけが適用され1条は適用されない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"国家賠償法6条の相互保証。","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-21","mock":"mock3","no":21,"format":"5肢択一","section":"法令等","subject":"国家賠償法","field":"公務員個人責任・求償","stem":"国家賠償法1条に関する次の記述のうち、妥当なものはどれか。","choices":["国または公共団体が賠償責任を負う場合、公務員個人も被害者に対して常に直接同じ責任を負う。","公務員の故意または重大な過失があるとき、国または公共団体はその公務員に求償できる。","国または公共団体から公務員への求償は一切認められない。","公務員が軽過失でも国は必ず全額求償しなければならない。","国家賠償法1条に求償規定はない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"国賠法1条2項。故意または重大な過失の場合に求償可能。","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-22","mock":"mock3","no":22,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"地方財務・地方債","stem":"地方公共団体の財務について、妥当なものはどれか。","choices":["地方公共団体は地方債を一切発行できない。","分担金、使用料、加入金および手数料に関する事項は条例で定める。","地方税の賦課徴収に関する条例は住民による条例制定改廃直接請求の対象となる。","地方公共団体の契約に地方自治法上の規制はない。","地方債は常に財務大臣の個別許可がなければ発行できない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"地方自治法228条等。地方税・分担金・使用料・手数料等は直接請求の対象除外にも注意。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-23","mock":"mock3","no":23,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"監査委員","stem":"監査委員について、妥当なものはどれか。","choices":["監査委員は裁判所が選任する。","監査委員は長が議会の同意を得て選任する。","監査委員は必ず国会議員でなければならない。","普通地方公共団体に監査委員制度はない。","監査委員は住民訴訟の判決を言い渡す。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"地方自治法196条。長が議会同意を得て選任する。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"標準","category":"長期空白"},{"id":"MOCK3-24","mock":"mock3","no":24,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"特別区","stem":"特別区に関する次の記述のうち、妥当なものはどれか。","choices":["特別区は普通地方公共団体である。","特別区は地方自治法上の特別地方公共団体である。","特別区には公選の長・議会は存在しない。","特別区は国の地方支分部局である。","東京都以外では法律上どのような制度を用いても特別区を設置できない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"特別区は特別地方公共団体。長・議会は公選。大都市地域特別区設置法による制度もある。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-25","mock":"mock3","no":25,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"議会解散・解職請求","stem":"地方自治法上の直接請求について、妥当なものはどれか。","choices":["議会解散請求や長の解職請求の制度は存在しない。","一定数の選挙権者の署名に基づき、議会の解散や長の解職を求める直接請求制度がある。","議会解散請求は国会に対して行う。","長の解職請求は裁判所判決だけで成立し住民投票は関係しない。","直接請求制度は条例制定改廃だけに限られる。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"地方自治法には条例制定改廃、事務監査、議会解散、議員・長等の解職などの直接請求がある。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-26","mock":"mock3","no":26,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政組織","stem":"国家行政組織について、妥当なものはどれか。","choices":["国家行政組織法上の行政機関の基本的な類型には、省・委員会・庁がある。","各省大臣は裁判所が任命する。","庁は必ず国会の一院に属する。","省・委員会・庁の設置廃止に法律は関係しない。","各省大臣は所管事務を分担管理しない。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"国家行政組織法上、省・委員会・庁を基本類型として設置規律を置く。","source":"https://laws.e-gov.go.jp/law/323AC0000000120?occasion_date=20260401","difficulty":"標準","category":"長期空白"},{"id":"MOCK3-27","mock":"mock3","no":27,"format":"5肢択一","section":"法令等","subject":"民法","field":"公序良俗","stem":"公序良俗に関する次の記述のうち、妥当なものはどれか。","choices":["公序良俗に反する法律行為も当事者が合意すれば必ず有効である。","公の秩序または善良の風俗に反する法律行為は無効である。","公序良俗は契約には適用されない。","公序良俗違反の判断では法律行為時の事情は一切考慮されない。","強行規定に反する法律行為でも公序良俗とは無関係で常に有効である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"民法90条。社会的妥当性を欠く法律行為を無効とする一般条項。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"標準","category":"長期空白"},{"id":"MOCK3-28","mock":"mock3","no":28,"format":"5肢択一","section":"法令等","subject":"民法","field":"取得時効","stem":"所有権の取得時効について、妥当なものはどれか。","choices":["所有の意思をもって20年間平穏かつ公然に他人の物を占有した者は、原則として所有権を時効取得する。","善意無過失で占有を開始しても10年で取得時効が完成することはない。","他主占有でも必ず取得時効できる。","取得時効には占有の継続は不要である。","取得時効の完成には必ず裁判所の判決が必要である。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"民法162条。20年、善意無過失で開始なら10年の短期取得時効。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-29","mock":"mock3","no":29,"format":"5肢択一","section":"法令等","subject":"民法","field":"地役権","stem":"地役権について、妥当なものはどれか。","choices":["地役権は要役地の便益のために他人の土地を一定目的に利用する物権である。","地役権は必ず承役地全部の占有を地役権者へ移す権利である。","地役権は要役地から切り離して自由に譲渡するのが原則である。","通行地役権は法律上認められない。","地役権は所有権と同じく無制限の全面支配権である。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"地役権は要役地の便益のため承役地を利用する物権で、要役地との従属性がある。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-30","mock":"mock3","no":30,"format":"5肢択一","section":"法令等","subject":"民法","field":"先取特権","stem":"先取特権について、妥当なものはどれか。","choices":["先取特権は当事者間の契約によってだけ成立する担保物権である。","先取特権は法律が定める一定の債権者に、他の債権者に先立って弁済を受ける権利を与える法定担保物権である。","先取特権は不動産には一切成立しない。","先取特権と質権の優先関係は常に先取特権が優先する。","先取特権には目的物との関係は不要である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"先取特権は法律上当然に成立する法定担保物権。種類ごとに順位・対抗要件が異なる。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-31","mock":"mock3","no":31,"format":"5肢択一","section":"法令等","subject":"民法","field":"弁済充当","stem":"弁済の充当に関する次の記述のうち、妥当なものはどれか。","choices":["費用・利息・元本のすべてを消滅させるに足りない給付をした場合、原則として元本から先に充当する。","費用・利息・元本がある場合の法定充当は、原則として費用、利息、元本の順に行う。","債務者はいつでも自由に費用を最後へ回すことができる。","弁済充当という制度は民法に存在しない。","債権者が受領した後でも債務者が自由に充当順序を変更できる。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"民法489条。費用→利息→元本の順。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"やや難","category":"薄出"},{"id":"MOCK3-32","mock":"mock3","no":32,"format":"5肢択一","section":"法令等","subject":"民法","field":"相殺","stem":"相殺について、妥当なものはどれか。","choices":["時効によって消滅した債権は、時効完成前に相殺適状であっても絶対に相殺できない。","時効消滅した債権でも、時効完成前に相殺適状にあったときは相殺に用いることができる場合がある。","相殺には必ず裁判所の判決が必要である。","双方の債権が同種でなくても常に相殺できる。","相殺禁止特約は第三者に対して必ず無条件に対抗できる。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"民法508条。時効完成前に相殺適状なら、時効完成後も相殺できる。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-33","mock":"mock3","no":33,"format":"5肢択一","section":"法令等","subject":"民法","field":"同時履行の抗弁","stem":"同時履行の抗弁権について、妥当なものはどれか。","choices":["双務契約の当事者は、相手方の債務が弁済期にあっても、自分だけ先に必ず履行しなければならない。","双務契約から生じる対価的債務について、相手方が履行または履行の提供をするまで自己の履行を拒める場合がある。","同時履行の抗弁権は不法行為にしか適用されない。","相手方の債務がまだ弁済期にない場合でも常に同時履行の抗弁が成立する。","同時履行の抗弁権を行使すると契約は当然解除される。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"民法533条。双務契約の対価関係にある債務の履行拒絶権。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-34","mock":"mock3","no":34,"format":"5肢択一","section":"法令等","subject":"民法","field":"委任","stem":"委任契約について、妥当なものはどれか。","choices":["委任者も受任者も契約を解除できない。","各当事者は原則としていつでも委任を解除できるが、相手方に不利な時期の解除等では損害賠償が問題となる。","受任者は特約がなくても当然に報酬を請求できる。","受任者は善良な管理者の注意義務を負わない。","委任は法律行為の委託に限らず、事実行為の委託も常に委任と呼ぶ。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"民法651条。解除自由が原則だが不利な時期等の損害賠償特則あり。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"標準","category":"長期空白"},{"id":"MOCK3-35","mock":"mock3","no":35,"format":"5肢択一","section":"法令等","subject":"民法","field":"2026改正・共同親権下の養子縁組","stem":"2026年4月1日施行の改正後、共同親権下にある15歳未満の子を、父母の一方の再婚相手と養子縁組させる場合について、妥当なものはどれか。","choices":["共同親権者の一方だけの代諾で常に足りる。","15歳未満の子の代諾は不要である。","共同親権の場合、原則として父母が共同で代諾する必要がある。","養子縁組が成立しても親権者は必ず元の父母2人のままである。","この改正は2026年4月1日時点では施行されていない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"法務省Q&A。共同親権下の15歳未満子の養子縁組は父母共同代諾が原則。","source":"https://www.moj.go.jp/MINJI/minji07_00377","difficulty":"難","category":"2026改正"},{"id":"MOCK3-36","mock":"mock3","no":36,"format":"5肢択一","section":"法令等","subject":"会社法","field":"会社の商号","stem":"会社の商号について、妥当なものはどれか。","choices":["株式会社は商号中に株式会社という文字を用いる必要がない。","会社はその種類に従い、株式会社、合名会社、合資会社または合同会社という文字を商号中に用いなければならない。","会社は他の会社であると誤認されるおそれのある名称を自由に使用できる。","会社の商号は登記と無関係である。","個人名を含む商号はすべて禁止される。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"会社法6条。会社の種類を示す文字を商号に用いる。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-37","mock":"mock3","no":37,"format":"5肢択一","section":"法令等","subject":"会社法","field":"定款の絶対的記載事項","stem":"株式会社の定款について、妥当なものはどれか。","choices":["目的は定款に記載しなくてもよい。","商号は定款の絶対的記載事項ではない。","目的、商号、本店所在地、設立に際して出資される財産の価額または最低額、発起人の氏名名称住所などは絶対的記載事項である。","発起人の氏名は定款に記載してはならない。","定款は口頭で作成できる。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"会社法27条。絶対的記載事項を欠くと定款として効力を生じない。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"やや難","category":"薄出"},{"id":"MOCK3-38","mock":"mock3","no":38,"format":"5肢択一","section":"法令等","subject":"会社法","field":"代表取締役","stem":"取締役会設置会社の代表取締役について、妥当なものはどれか。","choices":["代表取締役は株主総会が必ず選定する。","取締役会は取締役の中から代表取締役を選定しなければならない。","代表取締役は取締役でなくてもよい。","取締役会設置会社に代表取締役を置くことはできない。","代表取締役には会社代表権がない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"会社法362条・363条等。取締役会が取締役の中から代表取締役を選定。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-39","mock":"mock3","no":39,"format":"5肢択一","section":"法令等","subject":"会社法","field":"株主代表訴訟","stem":"株主代表訴訟について、妥当なものはどれか。","choices":["会社役員の責任を追及する訴えを株主が会社のために提起する制度がある。","株主代表訴訟は会社ではなく株主個人だけの損害を回復する制度である。","どのような株式会社でも株主は保有期間等を問わず無条件に直ちに代表訴訟できる。","株主代表訴訟は行政事件訴訟法上の民衆訴訟である。","会社法には役員責任追及の株主訴訟制度はない。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"株主代表訴訟は会社に代わり役員等の責任を追及する制度。会社類型等により要件がある。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"やや難","category":"薄出"},{"id":"MOCK3-40","mock":"mock3","no":40,"format":"5肢択一","section":"法令等","subject":"会社法","field":"持分会社","stem":"持分会社に関する次の記述のうち、妥当なものはどれか。","choices":["合名会社の社員は全員有限責任社員である。","合資会社には有限責任社員と無限責任社員が存在し得る。","合同会社の社員は全員無限責任社員である。","持分会社は法人ではない。","合名会社・合資会社・合同会社は会社法上の会社ではない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"合名=無限責任、合資=無限＋有限、合同=有限責任。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-41","mock":"mock3","no":41,"format":"多肢選択","section":"法令等","subject":"憲法","field":"憲法改正・国民主権","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n憲法改正は、各議院の総議員の［ア］以上の賛成で国会が発議し、国民に提案される。国民の承認には、特別の国民投票または国会が定める選挙の際に行われる投票で、その［イ］の賛成を必要とする。承認された改正は、天皇が国民の名でこの憲法と一体をなすものとして［ウ］する。憲法改正権の主体は最終的に［エ］に基礎を置く。","choices":[],"wordbank":"1.3分の2　2.過半数　3.公布　4.国民主権　5.4分の3　6.内閣　7.最高裁判所　8.国会　9.発令　10.地方自治　11.3分の1　12.全員一致　13.法律上　14.政令　15.承認　16.裁判　17.行政権　18.天皇主権　19.条約　20.予算","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=3分の2、イ=過半数、ウ=公布、エ=国民主権。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"標準","category":"薄出"},{"id":"MOCK3-42","mock":"mock3","no":42,"format":"多肢選択","section":"法令等","subject":"行政法","field":"行政事件訴訟法・訴訟類型","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n行政事件訴訟法上、公法上の法律関係に関する確認等を求める訴えを［ア］という。自己の法律上の利益にかかわらない資格で法律に定める場合に提起する訴えを［イ］といい、国または公共団体の機関相互の権限争いを法律に定める場合に提起する訴えを［ウ］という。また、民事訴訟で処分の存否・効力が争点となるものを一般に［エ］と呼ぶ。","choices":[],"wordbank":"1.当事者訴訟　2.民衆訴訟　3.機関訴訟　4.争点訴訟　5.取消訴訟　6.義務付け訴訟　7.差止め訴訟　8.無効等確認訴訟　9.住民訴訟　10.審査請求　11.再審査請求　12.行政指導　13.裁決　14.執行停止　15.形式的当事者訴訟　16.仮の義務付け　17.仮の差止め　18.公法上の確認　19.法律上の利益　20.原告適格","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=当事者訴訟、イ=民衆訴訟、ウ=機関訴訟、エ=争点訴訟。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-43","mock":"mock3","no":43,"format":"多肢選択","section":"法令等","subject":"行政法","field":"行政不服審査法・手続","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n審査請求人または参加人から申立てがあれば、原則として［ア］の機会が与えられる。審理員は、申立てまたは職権で所持人に［イ］を求めることができる。審理終結後、審理員は［ウ］を作成して審査庁へ提出する。法律に特別の定めがある場合、原裁決に不服がある者は［エ］をすることができる。","choices":[],"wordbank":"1.口頭意見陳述　2.物件の提出　3.裁決意見書　4.再審査請求　5.聴聞　6.弁明　7.参加　8.総代　9.審査基準　10.処分基準　11.行政指導　12.裁決　13.決定　14.執行停止　15.訴訟参加　16.証人尋問　17.公示　18.再調査の請求　19.理由提示　20.教示","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=口頭意見陳述、イ=物件の提出、ウ=裁決意見書、エ=再審査請求。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"やや難","category":"薄出"},{"id":"MOCK3-44","mock":"mock3","no":44,"format":"記述式","section":"法令等","subject":"行政法","field":"土地収用・形式的当事者訴訟","stem":"土地収用委員会の裁決で定められた補償額に不服がある土地所有者Xが、補償額の増額を求めたい。Xは誰を被告として、どの類型の訴えを提起すべきか。40字程度で記述しなさい。","choices":[],"wordbank":"","points":20,"answers":[],"model":"起業者を被告として、補償額の増額を求める形式的当事者訴訟を提起する。","explanation":"土地収用法の補償額争いは収用委員会を被告とする取消訴訟ではなく、起業者等との当事者訴訟。","source":"https://laws.e-gov.go.jp/law/326AC0100000219?occasion_date=20260401","difficulty":"難","category":"記述候補・長期空白"},{"id":"MOCK3-45","mock":"mock3","no":45,"format":"記述式","section":"法令等","subject":"民法","field":"2026改正・養子縁組","stem":"父母が離婚後も共同親権者である15歳未満の子を、父の再婚相手と養子縁組させる場合、誰がどのように承諾すべきか。40字程度で記述しなさい。","choices":[],"wordbank":"","points" =20260401"},{"id":"PRED-A11","subject":"行政法","field":"国家賠償法","topic":"1条・2条","stem":"国家賠償法について、正しいものはどれか。","choices":["1条は公の営造物の設置・管理の瑕疵を中心に定める。","2条は公務員の違法な公権力行使を中心に定める。","1条は公務員の違法な公権力行使、2条は公の営造物の設置・管理の瑕疵を中心に定める。","地方公共団体には適用されない。","道路は2条の公の営造物に含まれない。"],"answers":["3"],"explanation":"1条と2条の責任構造は判例問題の土台。","priority":"S","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401"},{"id":"PRED-A12","subject":"行政法","field":"国家賠償法","topic":"職務行為性","stem":"公務員が私的目的で行為した場合の国家賠償法1条について、正しいものはどれか。","choices":["私的目的なら客観的外形を問わず国賠責任は成立しない。","客観的に職務執行の外形を備えるときは、私的目的でも国賠1条の問題となり得る。","被害者は必ず公務員個人にのみ請求する。","故意の場合だけ国が責任を負う。","国賠1条は行政指導には適用されない。"],"answers":["2"],"explanation":"2024→2025でも反復した判例型。","priority":"A","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401"},{"id":"PRED-A13","subject":"行政法","field":"地方自治法","topic":"自治事務・法定受託事務","stem":"地方自治法上の自治事務と法定受託事務について、正しいものはどれか。","choices":["法定受託事務は地方公共団体の事務ではない。","自治事務には条例を制定できない。","地方公共団体の事務は自治事務と法定受託事務の区別を軸に、国等の関与を整理する必要がある。","両者に対する国等の関与は全く同一である。","機関委任事務制度が現在も第三分類として存続する。"],"answers":["3"],"explanation":"地方自治法の定番比較軸。","priority":"S","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401"},{"id":"PRED-A14","subject":"行政法","field":"地方自治法","topic":"条例・規則","stem":"地方自治法上の条例・規則について、正しいものはどれか。","choices":["普通地方公共団体は法令に違反しても条例を制定できる。","普通地方公共団体は法令に違反しない限り、その事務に関し条例を制定できる。","条例制定権は長にのみ属する。","長は規則を制定できない。","条例には制裁規定を一切設けられない。"],"answers":["2"],"explanation":"条例・規則・法令との関係は変形頻出。","priority":"A","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401"},{"id":"PRED-A15","subject":"行政法","field":"地方自治法","topic":"住民監査請求・住民訴訟","stem":"住民訴訟について、正しいものはどれか。","choices":["原則として住民監査請求を経ず直ちに提起できる。","非住民でも法律上の利害関係があれば提起できる。","原則として住民監査請求を経る必要がある。","勝訴時の賠償金は原告住民個人に支払われる。","対象は財務会計行為と無関係な行政活動全般である。"],"answers":["3"],"explanation":"監査前置・住民資格・請求類型をセットで整理。","priority":"A","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401"},{"id":"PRED-C01","subject":"民法","field":"親族","topic":"共同親権・単独行使","stem":"2026年4月1日施行の改正民法の下で、父母双方が親権者である場合について正しいものはどれか。","choices":["親権は例外なく常に共同で行使する。","監護・教育に関する日常の行為は一方が単独で行うことができる。","急迫の事情があっても単独行使できない。","短期間の観光旅行は常に共同決定が必要である。","緊急医療は家庭裁判所の許可がなければできない。"],"answers":["2"],"explanation":"共同親権でも日常行為と急迫事情では単独行使が可能。","priority":"S","source":"https://www.moj.go.jp/MINJI/parents_007.html"},{"id":"PRED-C02","subject":"民法","field":"親族","topic":"法定養育費","stem":"2026年4月1日以降に離婚し、養育費の取決めがない場合の法定養育費について、正しいものはどれか。","choices":["制度は存在しない。","子1人につき月2万円の暫定的・補充的養育費を請求できる。","子1人につき月8万円が法定養育費である。","離婚前から自動発生する。","最終的な養育費額を永久に固定する制度である。"],"answers":["2"],"explanation":"2万円は暫定・補充的な法定養育費。","priority":"S","source":"https://www.moj.go.jp/MINJI/parents_010.html"},{"id":"PRED-C03","subject":"民法","field":"親族","topic":"養育費先取特権","stem":"改正後の養育費債権の先取特権について、正しいものはどれか。","choices":["先取特権が付与される上限額は子1人月8万円である。","上限は月2万円である。","先取特権は一切認められない。","対象額に上限はない。","法定養育費と先取特権の額は必ず同額である。"],"answers":["1"],"explanation":"法定養育費2万円と先取特権上限8万円の数字入替えを警戒。","priority":"S","source":"https://www.moj.go.jp/content/001455370.pdf"},{"id":"PRED-C04","subject":"民法","field":"親族","topic":"財産分与","stem":"2026年4月1日以降に離婚した夫婦の財産分与について、正しいものはどれか。","choices":["家庭裁判所への申立期間は離婚後1年である。","離婚後2年である。","離婚後3年である。","離婚後5年である。","期間制限はない。"],"answers":["4"],"explanation":"施行後離婚は5年。2026年3月31日以前の離婚は2年。","priority":"S","source":"https://www.moj.go.jp/MINJI/parents_012.html"},{"id":"PRED-C05","subject":"民法","field":"債権","topic":"法定利率","stem":"2026年4月1日から2029年3月31日までの民法上の法定利率はどれか。","choices":["年1％","年2％","年3％","年4％","年5％"],"answers":["3"],"explanation":"第3期も年3％で据置き。","priority":"S","source":"https://www.moj.go.jp/MINJI/minji07_00366.html"},{"id":"PRED-C06","subject":"民法","field":"総則","topic":"消滅時効","stem":"一般の債権の消滅時効について、正しいものはどれか。","choices":["権利行使可能と知った時から3年だけである。","権利行使可能と知った時から5年、または権利行使可能時から10年という基本構造である。","客観的期間は一律20年である。","裁判所が常に職権で時効を適用する。","一般債権に消滅時効はない。"],"answers":["2"],"explanation":"主観5年・客観10年を基本軸にする。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C07","subject":"民法","field":"総則","topic":"無権代理・追認","stem":"無権代理行為の本人による追認について、正しいものはどれか。","choices":["追認しても行為時に遡ることはない。","追認は原則として契約時に遡って効力を生ずるが、第三者の権利を害することはできない。","本人は追認できない。","相手方だけが追認できる。","追認には常に家庭裁判所の許可が必要である。"],"answers":["2"],"explanation":"追認・拒絶・相手方取消し・表見代理を横断整理。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C08","subject":"民法","field":"物権","topic":"共有物の管理","stem":"共有物について、正しいものはどれか。","choices":["保存行為は常に全員一致が必要である。","管理事項は共有者の人数の過半数で決する。","各共有者は単独で保存行為をすることができる。","管理事項は常に全員一致で決する。","持分価格は管理決定で考慮されない。"],"answers":["3"],"explanation":"保存行為は単独可。管理は原則として持分価格の過半数。旧問を現行法へ更新。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C09","subject":"民法","field":"物権","topic":"即時取得","stem":"動産の即時取得について、正しいものはどれか。","choices":["相続による占有承継だけで即時取得できる。","占有改定だけでも直ちに即時取得できる。","取引行為により平穏・公然・善意無過失で占有を取得すること等が基本要件となる。","登録の有無を問わず自動車はすべて即時取得対象外である。","未成年者からの売買取消しを常に即時取得で対抗できる。"],"answers":["3"],"explanation":"取引行為・占有取得・善意無過失の境界を確認。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C10","subject":"民法","field":"物権","topic":"抵当権・物上代位","stem":"抵当権の物上代位について、正しいものはどれか。","choices":["賃料債権には一切物上代位できない。","目的債権の支払後でも自由に物上代位できる。","物上代位には原則として払渡しまたは引渡し前の差押えが必要である。","転貸賃料債権には例外なく物上代位できる。","抵当権者以外は差押えできない。"],"answers":["3"],"explanation":"差押え時期と対象債権をセットで。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C11","subject":"民法","field":"債権","topic":"債権者代位権","stem":"債権者代位権について、正しいものはどれか。","choices":["代位債権者は債務者の代理人として権利を行使する。","被保全債権期限前は保存行為も一切できない。","債権者は自己の名で債務者の権利を代位行使する制度である。","代位行使されると債務者は自己の権利を行使できなくなる。","形成権は一切代位対象にならない。"],"answers":["3"],"explanation":"本人代理ではなく債権者自身の権利として行使。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C12","subject":"民法","field":"債権","topic":"債権譲渡と相殺","stem":"債権譲渡と相殺について、正しいものはどれか。","choices":["譲渡通知前に取得した反対債権でも譲受人に相殺を一切主張できない。","所定の要件を満たす反対債権による相殺を譲受人に対抗できる場合がある。","債権譲渡後は相殺制度は適用されない。","二重譲渡通知が同時到達なら債権は無効となる。","確定日付ある通知は第三者対抗要件と無関係である。"],"answers":["2"],"explanation":"取得時期・発生原因・対抗要件を区別。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C13","subject":"民法","field":"契約","topic":"賃借権譲渡・転貸","stem":"賃借権の譲渡・転貸について、正しいものはどれか。","choices":["賃貸人の承諾なく自由に賃借権を譲渡できる。","賃貸人の承諾なく自由に転貸できる。","賃借人は原則として賃貸人の承諾を得なければ、賃借権を譲渡し又は転貸できない。","無断転貸でも賃貸人に解除権は一切ない。","転貸は借地借家法にだけ規定される。"],"answers":["3"],"explanation":"賃貸借は反復が強く、第三者関係へ変形しやすい。","priority":"S","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C14","subject":"民法","field":"債権各論","topic":"使用者責任・求償","stem":"使用者が被用者の不法行為について被害者へ賠償した場合の求償について、正しいものはどれか。","choices":["常に被用者へ全額求償できる。","被用者への求償は一切できない。","信義則上、事業の性格や勤務態様等を考慮した相当な限度に制限され得る。","被用者に故意がある場合だけ使用者責任が成立する。","共同不法行為では求償関係は生じない。"],"answers":["3"],"explanation":"不法行為は反復が強く、求償範囲の反転が典型誤肢。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"},{"id":"PRED-C15","subject":"民法","field":"相続","topic":"遺言","stem":"遺言について、正しいものはどれか。","choices":["18歳に達しなければ遺言できない。","15歳に達した者は遺言することができる。","夫婦による共同遺言は自由にできる。","自筆証書遺言は本文をワープロ作成して署名だけ自書すれば常に有効である。","遺言は一度すると撤回できない。"],"answers":["2"],"explanation":"遺言能力15歳、共同遺言禁止、方式・撤回をセットで。","priority":"A","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401"}],"mnemonics":[{"id":"MN-01","law":"行政手続法","topic":"審査基準/標準処理","phrase":"基準は義務、期間は努力。決めた期間は公表する。","priority":"S"},{"id":"MN-02","law":"行政手続法","topic":"行政指導","phrase":"指導は任意、従わぬだけで不利益ダメ。","priority":"S"},{"id":"MN-03","law":"行政手続法","topic":"聴聞/弁明","phrase":"聴聞は見る・聞く・調書あり。弁明は原則書面。","priority":"S"},{"id":"MN-04","law":"行政不服審査法","topic":"再調査","phrase":"再調査、法律あって・不作為なし・審理員なし。","priority":"A"},{"id":"MN-05","law":"行政不服審査法","topic":"審理員","phrase":"名簿は努力、意見書は作る、諮問は審査庁。","priority":"S"},{"id":"MN-06","law":"行政不服審査法","topic":"執行停止","phrase":"審査請求しても原則止まらず。","priority":"S"},{"id":"MN-07","law":"行政事件訴訟法","topic":"出訴期間","phrase":"知ったら6か月、処分から1年、正当理由は例外あり。","priority":"S"},{"id":"MN-08","law":"行政事件訴訟法","topic":"仮の救済","phrase":"執行停止は重大、仮救済は償えぬ損＋緊急。","priority":"S"},{"id":"MN-09","law":"国家賠償法","topic":"1条/2条","phrase":"1条は人の違法公権力、2条は公の営造物。","priority":"S"},{"id":"MN-10","law":"地方自治法","topic":"自治/受託","phrase":"自治と受託、違うのは国の関与。","priority":"S"},{"id":"MN-11","law":"民法","topic":"共同親権","phrase":"共同でも日常・急迫、単独OK。","priority":"S"},{"id":"MN-12","law":"民法","topic":"養育費","phrase":"法定2万、先取上限8万。混ぜるな。","priority":"S"},{"id":"MN-13","law":"民法","topic":"財産分与","phrase":"4月以後の離婚は5年、3月までなら2年。","priority":"S"},{"id":"MN-14","law":"民法","topic":"法定利率","phrase":"令和8から第3期、それでも3パー。","priority":"S"},{"id":"MN-15","law":"民法","topic":"時効","phrase":"知って5年、行使できて10年。","priority":"A"},{"id":"MN-16","law":"民法","topic":"共有","phrase":"保存は一人、管理は持分の過半数。","priority":"A"},{"id":"MN-17","law":"民法","topic":"即時取得","phrase":"取引・占有・善意無過失。占有改定だけは弱い。","priority":"A"},{"id":"MN-18","law":"民法","topic":"賃貸借","phrase":"譲渡・転貸、原則大家の承諾。","priority":"S"},{"id":"MN-19","law":"民法","topic":"債権者代位","phrase":"代理じゃない。自分の名で債務者の権利。","priority":"A"},{"id":"MN-20","law":"民法","topic":"遺言","phrase":"遺言15、共同禁止、方式守る。","priority":"A"}],"propositions":[{"id":"PROP-2016-8-1","year":2016,"subject":"行政法","field":"行政総論・取消し撤回","qno":8,"item":"1","statement":"許可後の違反を理由に将来に向かって許可効を失わせる行為は取消しである","correct":false,"tag":"取消し・撤回","trap":"用語入替","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1218","audit":"確認済"},{"id":"PROP-2016-8-2","year":2016,"subject":"行政法","field":"行政総論・取消し撤回","qno":8,"item":"2","statement":"取消し・撤回は授益的処分に対する不利益処分とは別物である","correct":false,"tag":"不利益処分","trap":"制度間混同","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1218","audit":"確認済"},{"id":"PROP-2016-8-3","year":2016,"subject":"行政法","field":"行政総論・取消し撤回","qno":8,"item":"3","statement":"撤回処分が取消判決で取り消されれば原処分の効力が復活する correct":false,"tag":"不当利得","trap":"善意悪意要件無視","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1784","audit":"確認済"},{"id":"PROP-2025-35-1","year":2025,"subject":"民法","field":"親族","qno":35,"item":"1","statement":"成年の非嫡出子を認知するには子の承諾が必要","correct":true,"tag":"認知","trap":"正肢","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1785","audit":"確認済"},{"id":"PROP-2025-35-2","year":2025,"subject":"民法","field":"親族","qno":35,"item":"2","statement":"父が胎児認知するには母の承諾が必要","correct":true,"tag":"認知","trap":"正肢","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1785","audit":"確認済"},{"id":"PROP-2025-35-3","year":2025,"subject":"民法","field":"親族","qno":35,"item":"3","statement":"認知は認知時からのみ効力を生じ遡及しない","correct":false,"tag":"認知","trap":"効力時点入替","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1785","audit":"確認済"},{"id":"PROP-2025-35-4","year":2025,"subject":"民法","field":"親族","qno":35,"item":"4","statement":"認知した父母は認知を取り消せない","correct":true,"tag":"認知","trap":"正肢","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1785","audit":"確認済"},{"id":"PROP-2025-35-5","year":2025,"subject":"民法","field":"親族","qno":35,"item":"5","statement":"認知の訴えは父母死亡から原則3年経過後は提起不可","correct":true,"tag":"認知","trap":"正肢","source":"https://www.pro.goukakudojyo.com/worksheet2/w_mainnendo.php?queID=1785","audit":"確認済"}]};

  <script>
(() => {
'use strict';

const DATA = window.GYOSEI_DATA || {mocks:{}, predicted30:[], mnemonics:[], propositions:[]};
const APP_VERSION = '1.0.5';
const STORAGE_KEY = 'gyosei2026_state_v1';
const EXAM_DATE_DEFAULT = '2026-11-08';
const INTERVALS = [1,3,7,14,30];
const MOCK_LABELS = {mock1:'第1回 予想模試', mock2:'第2回 予想模試', mock3:'第3回 FINAL'};
const CONF_LABELS = {understood:'根拠まで分かった', two:'2択で迷った', guess:'勘で正解', none:'全く不明'};

const main = document.getElementById('main');
const titleEl = document.getElementById('pageTitle');
const toastEl = document.getElementById('toast');
const modalRoot = document.getElementById('modalRoot');
const navButtons = [...document.querySelectorAll('.nav-btn')];

let route = 'home';
let studySession = null;
let mockSession = null;
let timerId = null;
let deferredInstallPrompt = null;

function defaultState(){
  return {
    version:1,
    settings:{examDate:EXAM_DATE_DEFAULT,dailyTarget:30,newDaily:20,subject:'すべて'},
    progress:{}, events:[], mockRuns:[], mnemonicProgress:{}, activeMock:null,
    createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
  };
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return defaultState();
    const s=Object.assign(defaultState(),JSON.parse(raw));
    s.settings=Object.assign(defaultState().settings,s.settings||{});
    s.progress=s.progress||{}; s.events=s.events||[]; s.mockRuns=s.mockRuns||[]; s.mnemonicProgress=s.mnemonicProgress||{};
    return s;
  }catch(e){console.warn(e);return defaultState();}
}
let state=loadState();
function saveState(){ state.updatedAt=new Date().toISOString(); localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }

function esc(v){ return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl(v){ return esc(v).replace(/\n/g,'<br>'); }
function today(){ return new Date().toLocaleDateString('sv-SE'); }
function addDays(dateStr,n){ const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+n); return d.toLocaleDateString('sv-SE'); }
function daysUntil(dateStr){ const a=new Date(today()+'T00:00:00'),b=new Date(dateStr+'T00:00:00'); return Math.max(0,Math.ceil((b-a)/86400000)); }
function shuffle(a){ const x=[...a]; for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; }
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1800); }
function fmtPct(x){ return Number.isFinite(x)?Math.round(x*100)+'%':'—'; }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }

// ---------- Dataset normalization ----------
const itemMap = new Map();
const mockQuestions = [];
Object.entries(DATA.mocks||{}).forEach(([mock,qs]) => (qs||[]).forEach(q=>{
  const item={...q,type:'mock',mock,topic:q.field||q.subject}; itemMap.set(item.id,item); mockQuestions.push(item);
}));
const predicted = (DATA.predicted30||[]).map(q=>({...q,type:'predicted',format:'5肢択一',section:'法令等',topic:q.topic||q.field,points:4,mock:''}));
predicted.forEach(q=>itemMap.set(q.id,q));
const propositions = (DATA.propositions||[]).filter(p=>p.correct!==null).map(p=>({...p,type:'proposition',format:'○×',topic:p.tag||p.field,points:1}));
propositions.forEach(p=>itemMap.set(p.id,p));
const mnemonics = DATA.mnemonics||[];

const subjects = ['すべて',...Array.from(new Set([...mockQuestions,...predicted,...propositions].map(x=>x.subject).filter(Boolean))).sort()];

function itemMeta(id){ return itemMap.get(id); }
function getProgress(id){ return state.progress[id] || null; }
function dueItems(){
  const t=today(); return Object.entries(state.progress).filter(([,p])=>p.due && p.due<=t && itemMap.has(p.id||'')===false ? false : true)
    .map(([id,p])=>({id,p})).filter(x=>x.p.due && x.p.due<=t && itemMap.has(x.id))
    .sort((a,b)=>(a.p.due||'').localeCompare(b.p.due||''));
}
function todayEvents(){ const t=today(); return state.events.filter(e=>e.date===t); }
function streak(){
  const dates=new Set(state.events.map(e=>e.date)); let n=0; const d=new Date(today()+'T12:00:00');
  while(dates.has(d.toLocaleDateString('sv-SE'))){n++;d.setDate(d.getDate()-1);} return n;
}
function masteryStats(){
  const vals=Object.values(state.progress); if(!vals.length)return {attempted:0,mastered:0,rate:0};
  const mastered=vals.filter(p=>(p.stage||0)>=4 && p.attempts>0 && p.correct/p.attempts>=.75).length;
  return {attempted:vals.length,mastered,rate:mastered/vals.length};
}
function recordProgress(id, correct, confidence='two', extra={}){
  const p=state.progress[id] || {id,attempts:0,correct:0,wrong:0,guesses:0,two:0,none:0,stage:0,due:today()};
  p.attempts++;
  if(correct) p.correct++; else p.wrong++;
  if(confidence==='guess')p.guesses++;
  if(confidence==='two')p.two++;
  if(confidence==='none')p.none++;
  let interval=1;
  if(!correct || confidence==='none' || confidence==='guess'){
    p.stage=0; interval=1;
  }else{
    const current=clamp(p.stage||0,0,INTERVALS.length-1);
    interval=INTERVALS[current];
    if(confidence==='two') interval=Math.min(interval,3);
    p.stage=Math.min(current+1,INTERVALS.length);
  }
  p.due=addDays(today(),interval); p.last=today(); p.lastConfidence=confidence; p.lastCorrect=!!correct;
  Object.assign(p,extra); state.progress[id]=p;
  state.events.push({date:today(),ts:Date.now(),id,correct:!!correct,confidence});
  if(state.events.length>6000) state.events=state.events.slice(-6000);
  saveState();
}
function weaknessScore(p){
  if(!p)return 0; return (p.wrong||0)*5+(p.none||0)*3+(p.guesses||0)*2+(p.two||0)+Math.max(0,3-(p.stage||0));
}
function weakGroups(){
  const g=new Map();
  Object.entries(state.progress).forEach(([id,p])=>{
    const it=itemMeta(id); if(!it)return;
    const key=(it.subject||'その他')+'｜'+(it.topic||it.field||'その他');
    const o=g.get(key)||{key,subject:it.subject||'その他',topic:it.topic||it.field||'その他',score:0,wrong:0,attempts:0,ids:[]};
    o.score+=weaknessScore(p); o.wrong+=p.wrong||0; o.attempts+=p.attempts||0; o.ids.push(id); g.set(key,o);
  });
  return [...g.values()].filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
}

// ---------- Router ----------
function setRoute(r){
  route=r; studySession=null;
  if(timerId && r!=='mocks'){clearInterval(timerId);timerId=null;}
  navButtons.forEach(b=>b.classList.toggle('active',b.dataset.route===r));
  const titles={home:'ホーム',study:'学習',mocks:'模試',weak:'弱点',settings:'設定'}; titleEl.textContent=titles[r]||'行政書士2026';
  render(); window.scrollTo({top:0,behavior:'instant'});
}
navButtons.forEach(b=>b.addEventListener('click',()=>setRoute(b.dataset.route)));
document.getElementById('quickReviewBtn').addEventListener('click',()=>startStudy('due'));

function render(){
  if(route==='home')renderHome();
  else if(route==='study')renderStudyMenu();
  else if(route==='mocks')renderMocks();
  else if(route==='weak')renderWeak();
  else renderSettings();
}

// ---------- Home ----------
function renderHome(){
  const dleft=daysUntil(state.settings.examDate); const due=dueItems().length; const st=masteryStats(); const tev=todayEvents().length; const target=state.settings.dailyTarget||30;
  const weak=weakGroups().slice(0,5);
  const mockBest={}; Object.keys(DATA.mocks||{}).forEach(k=>{const rs=state.mockRuns.filter(r=>r.mock===k);mockBest[k]=rs.length?Math.max(...rs.map(r=>r.total||0)):null;});
  main.innerHTML=`
    <section class="hero">
      <div class="sub">2026年11月8日 本試験まで</div><div class="countdown">あと ${dleft} 日</div>
      <div class="hero-row">
        <div class="hero-stat"><strong>${due}</strong><span>今日の復習</span></div>
        <div class="hero-stat"><strong>${tev}/${target}</strong><span>今日の回答</span></div>
        <div class="hero-stat"><strong>${streak()}</strong><span>連続学習日</span></div>
        <div class="hero-stat"><strong>${fmtPct(st.rate)}</strong><span>定着率</span></div>
      </div>
    </section>
    <div class="section-title">今日やる</div>
    <section class="grid">
      <div class="card clickable" data-action="home-study" data-mode="due"><span class="badge red">優先</span><div class="metric">${due}</div><div class="metric-label">復習期限が来た問題</div></div>
      <div class="card clickable" data-action="home-study" data-mode="daily"><span class="badge">自動</span><div class="metric">${state.settings.newDaily}</div><div class="metric-label">新規＋復習の今日セット</div></div>
      <div class="card clickable" data-action="home-study" data-mode="weak"><span class="badge amber">弱点</span><div class="metric">${weak.length?weak[0].score:0}</div><div class="metric-label">弱点スコア最大</div></div>
      <div class="card clickable" data-action="home-study" data-mode="mnemonic"><span class="badge green">暗記</span><div class="metric">${mnemonics.length}</div><div class="metric-label">口ずさみフレーズ</div></div>
    </section>
    <div class="section-title">教材</div>
    <section class="grid">
      <div class="card clickable" data-route-link="mocks"><h3>模試 3回</h3><p>全180問。3時間モード＋採点。</p></div>
      <div class="card clickable" data-action="home-study" data-mode="pred"><h3>2026予想30</h3><p>10年分析＋改正論点。</p></div>
      <div class="card clickable" data-action="home-study" data-mode="prop"><h3>命題 ○×</h3><p>${propositions.length.toLocaleString()}命題を肢単位で反復。</p></div>
      <div class="card clickable" data-route-link="weak"><h3>弱点ランキング</h3><p>間違い・勘・2択を自動集計。</p></div>
    </section>
    <div class="section-title">模試スコア</div>
    <div class="list">
      ${Object.keys(DATA.mocks||{}).map(k=>`<div class="list-row"><div class="rank">${k.slice(-1)}</div><div class="grow"><strong>${MOCK_LABELS[k]}</strong><p>${mockBest[k]===null?'未受験':'ベスト '+mockBest[k]+' / 300'}</p></div><button class="btn secondary" data-start-mock="${k}">開く</button></div>`).join('')}

function filterSubject(items){ const s=state.settings.subject||'すべて'; return s==='すべて'?items:items.filter(x=>x.subject===s); }
function buildStudyItems(mode, topicKey){
  const count=state.settings.newDaily||20;
  if(mode==='due') return dueItems().map(x=>itemMeta(x.id)).filter(Boolean);
  if(mode==='pred') return filterSubject(predicted).slice(0,Math.max(count,30));
  if(mode==='prop'){
    const due=dueItems().map(x=>itemMeta(x.id)).filter(x=>x?.type==='proposition');
    const fresh=filterSubject(propositions.filter(p=>!state.progress[p.id]));
    return [...due,...shuffle(fresh)].slice(0,count);
  }
  if(mode==='weak'){
    let ids=[];
    if(topicKey){const g=weakGroups().find(x=>x.key===topicKey);ids=g?g.ids:[];}
    else ids=Object.keys(state.progress).sort((a,b)=>weaknessScore(state.progress[b])-weaknessScore(state.progress[a]));
    return filterSubject(ids.map(itemMeta).filter(Boolean)).slice(0,count);
  }
  if(mode==='random') return shuffle(filterSubject([...predicted,...propositions])).slice(0,count);
  if(mode==='daily'){
    const due=dueItems().map(x=>itemMeta(x.id)).filter(Boolean);
    const newPred=predicted.filter(x=>!state.progress[x.id]);
    const newProp=propositions.filter(x=>!state.progress[x.id]);
    const fresh=shuffle(filterSubject([...newPred,...newProp]));
    return [...due,...fresh].slice(0,count);
  }
  return [];
}
function startStudy(mode, topicKey){
  if(mode==='mnemonic'){ startMnemonic(); return; }
  const items=buildStudyItems(mode,topicKey);
  if(!items.length){toast('対象問題がありません'); if(route!=='study')setRoute('study'); return;}
  route='study'; titleEl.textContent='学習'; navButtons.forEach(b=>b.classList.toggle('active',b.dataset.route==='study'));
  studySession={mode,items,idx:0,selected:null,submitted:false,score:null,answers:[],topicKey};
  renderStudyItem(); window.scrollTo(0,0);
}
function renderStudyItem(){

  }else{
    body=`<p class="q-stem">${nl(it.stem)}</p><div class="field"><label>自分の答案</label><textarea id="writtenAnswer" placeholder="40字程度で書く"></textarea></div><button class="btn full" style="margin-top:10px" id="writtenReveal">模範解答を見る</button>`;
  }
  if(it.type==='proposition' || it.format==='5肢択一' || it.format==='多肢選択'){
    body += `<button class="btn secondary full" style="margin-top:12px" data-dontknow="1">？ わからない / 答えを見る</button>`;
  }
  main.innerHTML=`<div class="study-head"><div><strong>${s.idx+1} / ${s.items.length}</strong><div class="progressbar" style="width:160px;margin-top:6px"><i style="width:${progress}%"></i></div></div><button class="btn secondary" id="quitStudy">終了</button></div><div class="question-card"><div class="q-meta">${metaBadges}</div>${body}<div id="studyFeedback"></div></div>`;
  document.getElementById('quitStudy').onclick=()=>{studySession=null;renderStudyMenu();};
  if(it.type==='proposition') document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>submitStudy(it,b.dataset.tf==='true'));
  else if(it.format==='5肢択一') document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>submitStudy(it,b.dataset.choice));
  else if(it.format==='多肢選択') document.getElementById('multiSubmit').onclick=()=>submitStudy(it,[...document.querySelectorAll('[data-multi]')].map(x=>x.value));
  else document.getElementById('writtenReveal').onclick=()=>submitWrittenStudy(it);

}

function rapPhraseFor(it, truth='', expl=''){
  const hay=[it.topic,it.tag,it.field,it.subject,it.stem,it.statement].filter(Boolean).join('｜');
  // First use existing curated mnemonic material.
  let best=null, bestScore=0;
  for(const m of mnemonics){
    const keys=String(m.topic||'').split(/[\/・]/).filter(x=>x.length>=2);
    const score=keys.reduce((n,k)=>n+(hay.includes(k)?k.length:0),0) + (hay.includes(String(m.topic||''))?10:0);
    if(score>bestScore){best=m;bestScore=score;}
  }
  if(best && bestScore>=2) return best.phrase;
  for(const [re,phrase] of RAP_RULES){ if(re.test(hay)) return phrase; }

  // For questions with an explanation, compress the first useful sentence.
  const core=String(expl||'').replace(/\s+/g,' ').split(/[。！？]/).find(x=>x.trim().length>=8);
  if(core){
    const short=core.trim().slice(0,52);
    return (short.length<core.trim().length?short+'…':short)+'。ここを声で3回。';
  }
  // For proposition drills, avoid repeating a false proposition as if it were true.
  if(it.type==='proposition'){
    return `${it.correct?'この肢は○':'この肢は×'}。論点「${it.tag||it.field||'ここ'}」、罠は「${it.trap||'入替え'}」。`;
  }
  return `${truth||'正解を確認'}。要件・例外・効果、3拍で覚える。`;
}

function splitRapBeats(text){
  const s=String(text||'').replace(/\s+/g,' ').trim();
  const parts=s
    .replace(/[。！？]/g,m=>m+'|')
    .replace(/[、，]/g,m=>m+'|')
    .replace(/・/g,'・|')
    .split('|').map(x=>x.trim()).filter(Boolean);
  if(parts.length>1)return parts;
  if(s.length<=14)return [s];
  const size=Math.ceil(s.length/3);
  return [s.slice(0,size),s.slice(size,size*2),s.slice(size*2)].filter(Boolean);
}
function waitMs(ms){return new Promise(r=>setTimeout(r,ms));}
function speakOne(text,rate,pitch){
  return new Promise(resolve=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=rate;u.pitch=pitch;u.volume=1;
    u.onend=resolve;u.onerror=resolve;
    speechSynthesis.speak(u);
  });
}
function beatClick(freq=180,duration=.04,volume=.025){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ctx=beatClick.ctx||(beatClick.ctx=new AC());
    if(ctx.state==='suspended')ctx.resume();
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.value=freq;
    gain.gain.setValueAtTime(volume,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+duration);
  }catch(e){}
}
async function speakRap(text,mode='rhythm3'){
  if(!('speechSynthesis' in window)){toast('この端末では読み上げ非対応です');return;}
  speechSynthesis.cancel();
  if(mode==='normal'){await speakOne(text,.9,1.02);return;}
  const beats=splitRapBeats(text);
  const passes=[
    {rate:.94,pitch:1.02,pause:210},
    {rate:1.08,pitch:1.07,pause:160},
    {rate:.90,pitch:.98,pause:260}
  ];
  toast('🥁 リズム読み上げ ×3');
  for(let p=0;p<passes.length;p++){
    const pass=passes[p];
    beatClick(170,.04,.035);await waitMs(140);
    beatClick(220,.04,.035);await waitMs(190);
    for(let i=0;i<beats.length;i++){
      const last=i===beats.length-1;
      beatClick(last?260:190,.035,.022);
      await waitMs(55);
      await speakOne(beats[i],last?pass.rate*.93:pass.rate,last?pass.pitch*.94:pass.pitch);
      await waitMs(last?pass.pause+140:pass.pause);
    }
    if(p<passes.length-1)await waitMs(300);
  }
}
function rapHtml(it,truth,expl){
  const rap=rapPhraseFor(it,truth,expl);
  return `<div class="rap-box"><div class="rap-label">🎤 口ずさみ3回</div><div class="rap-phrase">${esc(rap)}</div><div class="rap-hint">意味のかたまりごとに、一定の拍で3周します。</div><div class="rap-actions"><button class="btn secondary" data-speak-rap="1">🥁 リズムで3回</button><button class="btn outline" data-speak-normal="1">▶ 普通に読む</button></div><button class="btn outline full" data-repeat-rap="1" style="margin-top:8px">声に出した回数 0/3</button></div>`;
}
function submitDontKnow(it){
  if(studySession.submitted)return;

  const rap=rapPhraseFor(it,truth,expl);
  document.querySelector('[data-speak-rap]')?.addEventListener('click',()=>speakRap(rap,'rhythm3'));document.querySelector('[data-speak-normal]')?.addEventListener('click',()=>speakRap(rap,'normal'));

  }
  document.getElementById('dontKnowNext').onclick=nextStudy;
}
function submitStudy(it, answer){
  if(studySession.submitted)return;

  else if(it.format==='5肢択一') correct=String(answer)===String(it.answers?.[0]||'');
  else correct=(it.answers||[]).every((a,i)=>String(answer[i])===String(a));
  studySession.submitted=true; studySession.score=correct;
  const fb=document.getElementById('studyFeedback');
  if(it.format==='5肢択一'){
    document.querySelectorAll('[data-choice]').forEach(b=>{const v=b.dataset.choice;b.disabled=true;if(v===String(it.answers?.[0]))b.classList.add('correct');else if(v===String(answer))b.classList.add('wrong');});
  }
  const truth=it.type==='proposition'?(it.correct?'○ 正しい':'× 誤り'):(it.format==='多肢選択'?`正解：${it.answers.join(' / ')}`:`正解：${it.answers?.[0]||''}`);
  const expl=it.type==='proposition'?`論点：${it.tag||''}\n誤肢パターン：${it.trap||''}`:(it.explanation||'');
  fb.innerHTML=`<div class="feedback ${correct?'good':'bad'}"><h4>${correct?'○ 正解':'× 不正解'}　${esc(truth)}</h4><p>${nl(expl)}</p>${it.source?`<p style="margin-top:7px"><a href="${esc(it.source)}" target="_blank" rel="noopener">根拠資料を開く</a></p>`:''}</div><div class="section-title">今の感覚</div><div class="confidence">${Object.entries(CONF_LABELS).map(([k,v])=>`<button class="conf-btn" data-conf="${k}">${v}</button>`).join('')}</div>`;
  document.querySelectorAll('[data-conf]').forEach(b=>b.onclick=()=>{recordProgress(it.id,correct,b.dataset.conf);nextStudy();});
}
function submitWrittenStudy(it){

function startMnemonic(){route='study';titleEl.textContent='口ずさみ暗記';navButtons.forEach(b=>b.classList.toggle('active',b.dataset.route==='study'));studySession={mode:'mnemonic',items:mnemonics,idx:0};renderMnemonic();}
function renderMnemonic(){
  const s=studySession;if(!s||s.idx>=s.items.length){main.innerHTML='<div class="card empty">口ずさみ20本を一周しました。<br><br><button class="btn" id="mnAgain">もう一周</button></div>';document.getElementById('mnAgain').onclick=startMnemonic;return;}
  const m=s.items[s.idx]; const mp=state.mnemonicProgress[m.id]||{good:0,weak:0};
  main.innerHTML=`<div class="study-head"><strong>${s.idx+1} / ${s.items.length}</strong><button class="btn secondary" id="quitMn">終了</button></div><div class="question-card"><div class="q-meta"><span class="badge">${esc(m.law)}</span><span class="badge">${esc(m.topic)}</span><span class="badge ${m.priority==='S'?'red':''}">${esc(m.priority)}</span></div><p class="note">先に自分で言ってから、タップで答えを表示。</p><div class="mnemonic reveal" id="mnPhrase">${esc(m.phrase)}</div><button class="btn full secondary" id="revealMn">表示する</button><div class="btn-row" style="margin-top:12px"><button class="btn outline" data-mn="weak">まだ弱い</button><button class="btn" data-mn="good">言えた</button></div><p class="note">記録：言えた ${mp.good} / 弱い ${mp.weak}</p></div>`;
  document.getElementById('revealMn').onclick=()=>document.getElementById('mnPhrase').classList.add('show');
  document.getElementById('quitMn').onclick=()=>{studySession=null;renderStudyMenu();};
  document.querySelectorAll('[data-mn]').forEach(b=>b.onclick=()=>{const x=state.mnemonicProgress[m.id]||{good:0,weak:0};x[b.dataset.mn]++;x.last=today();state.mnemonicProgress[m.id]=x;saveState();s.idx++;renderMnemonic();});
}

// ---------- Mocks ----------
function renderMocks(){
  const cards=Object.keys(DATA.mocks||{}).map(k=>{
    const runs=state.mockRuns.filter(r=>r.mock===k).sort((a,b)=>b.ts-a.ts); const last=runs[0]; const best=runs.length?Math.max(...runs.map(x=>x.total)):null;
    return `<div class="card"><div class="q-meta"><span class="badge">60問</span><span class="badge">180分</span></div><h3>${MOCK_LABELS[k]}</h3><p>${last?`前回 ${last.total}/300　法令 ${last.law}/244　基礎 ${last.basic}/56`:'未受験'}</p><p>${best!==null?`ベスト ${best}/300`:'本番形式で診断'}</p><button class="btn full" data-start-mock="${k}" style="margin-top:12px">模試を開始</button></div>`;
  }).join('');
  main.innerHTML=`${state.activeMock?`<div class="card" style="border-color:#e2ad67;margin-bottom:12px"><span class="badge amber">途中保存</span><h3 style="margin-top:8px">${MOCK_LABELS[state.activeMock.mock]}</h3><p>問${state.activeMock.idx+1}から再開できます。</p><button class="btn full" id="resumeMock">再開</button></div>`:''}<div class="grid">${cards}</div><p class="note" style="margin-top:14px">模試中は正解を表示しません。終了後、記述3問を自己採点すると公式基準（法令122・基礎24・総合180）と比較します。</p>`;
  bindCommon();
  if(state.activeMock)document.getElementById('resumeMock').onclick=resumeMock;
}
function startMock(key){
  if(state.activeMock && !confirm('途中の模試を破棄して新しく開始しますか？'))return;
  const qs=DATA.mocks[key]; if(!qs?.length){toast('模試データがありません');return;}
  mockSession={mock:key,idx:0,answers:{},unknowns:{},writtenScores:{},startedAt:Date.now(),durationSec:10800,finished:false};
  state.activeMock=mockSession;saveState();renderMockQuestion();startTimer();
}
function resumeMock(){mockSession=state.activeMock;if(!mockSession)return;mockSession.unknowns=mockSession.unknowns||{};renderMockQuestion();startTimer();}
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{const el=document.getElementById('mockTimer');if(!el)return;const remain=mockRemaining();el.textContent=formatTime(remain);if(remain<=0){clearInterval(timerId);finishMock();}},1000);}
function mockRemaining(){if(!mockSession)return 0;return Math.max(0,mockSession.durationSec-Math.floor((Date.now()-mockSession.startedAt)/1000));}
function formatTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;}
function renderMockQuestion(){
  route='mocks';titleEl.textContent=MOCK_LABELS[mockSession.mock];navButtons.forEach(b=>b.classList.toggle('active',b.dataset.route==='mocks'));
  mockSession.unknowns=mockSession.unknowns||{};
  const qs=DATA.mocks[mockSession.mock];const q=qs[mockSession.idx];const saved=mockSession.answers[q.id];
  const revealed=!!mockSession.unknowns[q.id];
  let body='';
  if(q.format==='5肢択一'){
    body=`<div class="choice-list">${q.choices.map((ch,i)=>{
      const n=String(i+1), correct=String(q.answers?.[0]||'')===n;
      const cls=revealed?(correct?'correct':''):(String(saved)===n?'selected':'');
      return `<button class="choice ${cls}" data-mock-choice="${n}" ${revealed?'disabled':''}><span class="num">${n}</span>${nl(ch)}</button>`;
    }).join('')}</div>`;
  }else if(q.format==='多肢選択'){
    if(revealed){
      body=`<div class="wordbank">${nl(q.wordbank)}</div><div class="feedback bad"><h4>正解</h4><p>${esc((q.answers||[]).join(' / '))}</p></div>`;
    }else{
      const a=Array.isArray(saved)?saved:['','','',''];
      body=`<div class="wordbank">${nl(q.wordbank)}</div><div class="multi-grid">${['ア','イ','ウ','エ'].map((x,i)=>`<div class="field"><label>${x}</label><select data-mock-multi="${i}"><option value="">選択</option>${Array.from({length:20},(_,j)=>`<option value="${j+1}" ${String(a[i])===String(j+1)?'selected':''}>${j+1}</option>`).join('')}</select></div>`).join('')}</div>`;
    }
  }else{
    if(revealed){
      body=`<div class="feedback bad"><h4>模範解答</h4><p>${nl(q.model||'')}</p></div>`;
    }else{
      body=`<div class="field"><label>答案</label><textarea id="mockWritten" placeholder="40字程度">${esc(saved||'')}</textarea></div>`;
    }
  }

  const unknownBox = revealed
    ? `<div class="feedback bad" style="margin-top:12px"><h4>？ わからない → 0点扱いで正解を確認</h4><p>${nl(q.explanation||'')}</p>${q.source?`<p style="margin-top:7px"><a href="${esc(q.source)}" target="_blank" rel="noopener">根拠資料を開く</a></p>`:''}</div>${rapHtml(q,q.format==='多肢選択'?`正解：${(q.answers||[]).join(' / ')}`:q.format==='記述式'?'模範解答を確認':`正解：${q.answers?.[0]||''}`,q.explanation||'')}`
    : `<button class="btn outline full" id="mockDontKnow" style="margin-top:12px;border-color:#e0b15d;color:#8b5a00">？ わからない（0点で答えを見る）</button>`;

  main.innerHTML=`<div class="study-head"><div><strong>問 ${q.no} / 60</strong><div class="q-meta" style="margin:5px 0 0"><span class="badge">${esc(q.subject)}</span><span class="badge">${esc(q.field)}</span></div></div><div class="mock-timer" id="mockTimer">${formatTime(mockRemaining())}</div></div><div class="question-card"><p class="q-stem">${nl(q.stem)}</p>${body}${unknownBox}<div class="mock-nav"><button class="btn secondary" id="mockPrev" ${mockSession.idx===0?'disabled':''}>← 前</button><button class="btn secondary" id="mockNext">${mockSession.idx===59?'確認へ':'次 →'}</button></div><div class="mock-grid">${qs.map((x,i)=>`<button data-jump="${i}" class="${i===mockSession.idx?'current':''} ${mockSession.unknowns[x.id]?'unknown':(mockSession.answers[x.id]!=null&&mockSession.answers[x.id]!==''?'done':'')}">${x.no}</button>`).join('')}</div><button class="btn danger full" id="finishMockBtn" style="margin-top:14px">模試を終了して採点へ</button></div>`;

  if(!revealed)bindMockInput(q);
  document.getElementById('mockPrev').onclick=()=>goMock(mockSession.idx-1);
  document.getElementById('mockNext').onclick=()=>mockSession.idx===59?reviewMock():goMock(mockSession.idx+1);

  document.getElementById('mockDontKnow')?.addEventListener('click',()=>{
    if(!confirm('答えを表示すると、この問題は0点扱いになります。正解と口ずさみ暗記を表示しますか？'))return;
    captureMockInput(q);
    mockSession.unknowns[q.id]=true;
    delete mockSession.answers[q.id];
    state.activeMock=mockSession;saveState();renderMockQuestion();
  });

  if(revealed){
    const rap=rapPhraseFor(q,q.format==='多肢選択'?`正解：${(q.answers||[]).join(' / ')}`:q.format==='記述式'?'模範解答を確認':`正解：${q.answers?.[0]||''}`,q.explanation||'');
    document.querySelector('[data-speak-rap]')?.addEventListener('click',()=>speakRap(rap,'rhythm3'));document.querySelector('[data-speak-normal]')?.addEventListener('click',()=>speakRap(rap,'normal'));
    const repeatBtn=document.querySelector('[data-repeat-rap]');
    if(repeatBtn){
      let n=0;
      repeatBtn.addEventListener('click',()=>{n++;repeatBtn.textContent=n>=3?'✓ 3回言えた':`声に出した回数 ${n}/3`;if(n>=3)repeatBtn.disabled=true;});
    }
  }
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>goMock(Number(b.dataset.jump)));
  document.getElementById('finishMockBtn').onclick=()=>{captureMockInput(q);if(confirm('模試を終了して採点へ進みますか？'))finishMock();};
}
function bindMockInput(q){
  if(mockSession.unknowns?.[q.id])return;
  if(q.format==='5肢択一')document.querySelectorAll('[data-mock-choice]').forEach(b=>b.onclick=()=>{mockSession.answers[q.id]=b.dataset.mockChoice;state.activeMock=mockSession;saveState();renderMockQuestion();});
  if(q.format==='多肢選択')document.querySelectorAll('[data-mock-multi]').forEach(s=>s.onchange=()=>{mockSession.answers[q.id]=[...document.querySelectorAll('[data-mock-multi]')].map(x=>x.value);state.activeMock=mockSession;saveState();});
  if(q.format==='記述式')document.getElementById('mockWritten').oninput=e=>{mockSession.answers[q.id]=e.target.value;state.activeMock=mockSession;saveState();};
}
function captureMockInput(q){
  if(mockSession.unknowns?.[q.id]){state.activeMock=mockSession;saveState();return;}
  if(q.format==='多肢選択')mockSession.answers[q.id]=[...document.querySelectorAll('[data-mock-multi]')].map(x=>x.value);
  if(q.format==='記述式')mockSession.answers[q.id]=document.getElementById('mockWritten')?.value||'';
  state.activeMock=mockSession;saveState();
}
function goMock(i){const q=DATA.mocks[mockSession.mock][mockSession.idx];captureMockInput(q);mockSession.idx=clamp(i,0,59);state.activeMock=mockSession;saveState();renderMockQuestion();window.scrollTo(0,0);}
function reviewMock(){
  const q=DATA.mocks[mockSession.mock][mockSession.idx];captureMockInput(q);
  const qs=DATA.mocks[mockSession.mock];
  const unknowns=qs.filter(x=>mockSession.unknowns?.[x.id]).map(x=>x.no);
  const unanswered=qs.filter(x=>!mockSession.unknowns?.[x.id]&&(mockSession.answers[x.id]==null||mockSession.answers[x.id]===''||(Array.isArray(mockSession.answers[x.id])&&mockSession.answers[x.id].some(v=>!v)))).map(x=>x.no);
  openModal(`<h2>提出前の確認</h2><p>？わからない（0点）：${unknowns.length?unknowns.join(', '):'なし'}</p><p>未回答：${unanswered.length?unanswered.join(', '):'なし'}</p><p class="note">「わからない」で答えを見た問題は0点で、弱点復習に回します。記述3問は提出後に自己採点します。</p><div class="btn-row"><button class="btn secondary" data-modal-close>戻る</button><button class="btn danger" id="confirmFinish">提出する</button></div>`);
  document.getElementById('confirmFinish').onclick=()=>{closeModal();finishMock();};
}
function calcMock(writtenScores={}){
  const qs=DATA.mocks[mockSession.mock];let law=0,basic=0,auto=0;
  qs.forEach(q=>{
    let sc=0,a=mockSession.answers[q.id];
    if(mockSession.unknowns?.[q.id]){if(q.no<=46)law+=0;else basic+=0;return;}
    if(q.format==='5肢択一')sc=String(a||'')===String(q.answers?.[0]||'')?4:0;
    else if(q.format==='多肢選択')sc=(q.answers||[]).reduce((s,x,i)=>s+(String(a?.[i]||'')===String(x)?2:0),0);
    else sc=Number(writtenScores[q.id]||0);
    if(q.no<=46)law+=sc;else basic+=sc;if(q.format!=='記述式')auto+=sc;
  });
  return {law,basic,total:law+basic,auto};
}
function finishMock(){clearInterval(timerId);timerId=null;mockSession.finished=true;renderMockResult();}
function renderMockResult(){
  const qs=DATA.mocks[mockSession.mock];const written=qs.filter(q=>q.format==='記述式');const score=calcMock(mockSession.writtenScores);
  main.innerHTML=`<div class="card result-big"><span class="badge">自動採点＋記述自己採点</span><div class="num">${score.total}</div><p>記述を採点すると総合点が確定します。</p><div class="thresholds"><div class="threshold ${score.law>=122?'ok':'ng'}"><strong>${score.law}</strong>法令 /244</div><div class="threshold ${score.basic>=24?'ok':'ng'}"><strong>${score.basic}</strong>基礎 /56</div><div class="threshold ${score.total>=180&&score.law>=122&&score.basic>=24?'ok':'ng'}"><strong>${score.total}</strong>総合 /300</div></div></div><div class="section-title">記述式 自己採点</div>${written.map(q=>`<div class="card" style="margin-bottom:10px"><span class="badge">問${q.no}</span><p class="q-stem" style="font-size:13px">${nl(q.stem)}</p><div class="feedback"><h4>自分の答案</h4><p>${nl(mockSession.answers[q.id]||'（未回答）')}</p><div class="divider"></div><h4>模範解答</h4><p>${nl(q.model||'')}</p></div><div class="btn-row" style="margin-top:10px">${[0,5,10,15,20].map(x=>`<button class="btn ${Number(mockSession.writtenScores[q.id])===x?'':'outline'}" data-mock-wscore="${q.id}" data-score="${x}">${x}</button>`).join('')}</div></div>`).join('')}<button class="btn full" id="saveMockRun">採点を確定して保存</button>`;
  document.querySelectorAll('[data-mock-wscore]').forEach(b=>b.onclick=()=>{mockSession.writtenScores[b.dataset.mockWscore]=Number(b.dataset.score);renderMockResult();});
  document.getElementById('saveMockRun').onclick=saveMockRun;
}
function saveMockRun(){
  const sc=calcMock(mockSession.writtenScores);const qs=DATA.mocks[mockSession.mock];
  qs.forEach(q=>{
    let correct=false;
    const wasUnknown=!!mockSession.unknowns?.[q.id];
    if(q.format==='5肢択一')correct=String(mockSession.answers[q.id]||'')===String(q.answers?.[0]||'');
    else if(q.format==='多肢選択')correct=(q.answers||[]).every((x,i)=>String(mockSession.answers[q.id]?.[i]||'')===String(x));
    else correct=Number(mockSession.writtenScores[q.id]||0)>=15;
    if(wasUnknown) correct=false;
    recordProgress(q.id,correct,wasUnknown?'none':(correct?'two':'none'),{fromMock:mockSession.mock,wasUnknown,lastWrittenScore:q.format==='記述式'?Number(mockSession.writtenScores[q.id]||0):undefined});
  });
  state.mockRuns.push({mock:mockSession.mock,ts:Date.now(),date:today(),law:sc.law,basic:sc.basic,total:sc.total,answers:mockSession.answers,writtenScores:mockSession.writtenScores});
  state.activeMock=null;saveState();
  const ok=sc.law>=122&&sc.basic>=24&&sc.total>=180;
  main.innerHTML=`<div class="card result-big"><span class="badge ${ok?'green':'red'}">${ok?'合格基準クリア':'基準未達'}</span><div class="num">${sc.total}</div><p>法令 ${sc.law}/244　基礎 ${sc.basic}/56</p><button class="btn" id="backMocks">模試一覧へ</button></div>`;
  mockSession=null;document.getElementById('backMocks').onclick=renderMocks;
}

// ---------- Weakness ----------
function renderWeak(){
  const groups=weakGroups();
  main.innerHTML=`<div class="card"><h3>弱点ランキング</h3><p>誤答5点・「全く不明」3点・勘2点・2択1点を加重。弱い論点ほど上に出ます。</p></div><div class="section-title">上位 ${Math.min(30,groups.length)} 論点</div><div class="list">${groups.length?groups.slice(0,30).map((w,i)=>`<div class="list-row"><div class="rank">${i+1}</div><div class="grow"><strong>${esc(w.topic)}</strong><p>${esc(w.subject)}・誤答 ${w.wrong} / 回答 ${w.attempts}</p></div><span class="score-pill">${w.score}</span><button class="btn secondary" data-topic="${esc(w.key)}">解く</button></div>`).join(''):'<div class="card empty">まだ弱点データがありません。模試か学習をすると自動で作られます。</div>'}</div>`;
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>startStudy('weak',b.dataset.topic));
}

// ---------- Settings ----------
function renderSettings(){
  main.innerHTML=`
    <div class="card settings-block"><h3>学習設定</h3><div class="filters"><div class="field"><label>1日の目標回答数</label><select id="dailyTarget">${[20,30,40,50,60].map(n=>`<option ${n===state.settings.dailyTarget?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>自動セット問題数</label><select id="newDaily">${[10,20,30,40,50].map(n=>`<option ${n===state.settings.newDaily?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field" style="margin-top:10px"><label>本試験日</label><input id="examDate" type="date" value="${esc(state.settings.examDate)}"></div><button class="btn full" id="saveSettings" style="margin-top:12px">設定を保存</button></div>
    <div class="card settings-block"><h3>データ</h3><p class="note">模試 ${mockQuestions.length}問＋予想 ${predicted.length}問＋命題 ${propositions.length.toLocaleString()}件＋口ずさみ ${mnemonics.length}本。</p><div class="btn-row"><button class="btn secondary" id="exportProgress">進捗を書き出す</button><label class="btn outline" for="importProgress" style="display:inline-flex;align-items:center">進捗を読み込む</label><input id="importProgress" type="file" accept="application/json" hidden></div></div>
    <div class="card settings-block"><h3>iPhoneにアプリとして追加</h3><p class="note">${isStandalone()?'現在ホーム画面アプリとして起動しています。':'HTTPSで公開したURLをSafariで開き、共有 →「ホーム画面に追加」でインストールできます。'} ${location.protocol==='file:'?'現在はファイルとして開いています。学習機能は動きますが、PWAインストールにはHTTPS公開が必要です。':''}</p><button class="btn secondary full" id="installBtn" ${deferredInstallPrompt?'':'disabled'}>インストールを実行</button></div>
    <div class="card settings-block"><h3>プライバシー</h3><p class="note">進捗・弱点・模試答案はこの端末のブラウザ内（localStorage）だけに保存します。アプリ本体から外部サーバーへ送信しません。根拠URLをタップした場合だけ外部サイトを開きます。</p></div>
    <div class="card settings-block danger-zone"><h3>リセット</h3><p class="note">すべての進捗・模試結果を消去します。</p><button class="btn danger full" id="resetProgress">全データをリセット</button></div>
    <p class="note" style="text-align:center">行政書士2026 Drill v${APP_VERSION}</p>`;
  document.getElementById('saveSettings').onclick=()=>{state.settings.dailyTarget=Number(document.getElementById('dailyTarget').value);state.settings.newDaily=Number(document.getElementById('newDaily').value);state.settings.examDate=document.getElementById('examDate').value||EXAM_DATE_DEFAULT;saveState();toast('保存しました');};
  document.getElementById('exportProgress').onclick=exportProgress;
  document.getElementById('importProgress').onchange=importProgress;
  document.getElementById('resetProgress').onclick=()=>{if(confirm('本当に全進捗を削除しますか？')){state=defaultState();saveState();renderSettings();toast('リセットしました');}};
  document.getElementById('installBtn').onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;renderSettings();};
}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`gyosei2026-progress-${today()}.json`;a.click();URL.revokeObjectURL(url);}
function importProgress(e){const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.progress)throw new Error();state=Object.assign(defaultState(),x);saveState();toast('進捗を読み込みました');renderSettings();}catch{alert('進捗JSONを読み込めませんでした');}};rd.readAsText(f);}

// ---------- Shared events / modal ----------
function bindCommon(){
  document.querySelectorAll('[data-action="home-study"]').forEach(b=>b.onclick=()=>startStudy(b.dataset.mode));
  document.querySelectorAll('[data-route-link]').forEach(b=>b.onclick=()=>setRoute(b.dataset.routeLink));
  document.querySelectorAll('[data-start-mock]').forEach(b=>b.onclick=()=>startMock(b.dataset.startMock));
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>startStudy('weak',b.dataset.topic));
}
function openModal(html){modalRoot.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal">${html}</div></div>`;document.querySelectorAll('[data-modal-close]').forEach(b=>b.onclick=closeModal);document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal();};}
function closeModal(){modalRoot.innerHTML='';}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;if(route==='settings')renderSettings();});
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js?v=8',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
  }).catch(console.warn);
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading)return;
    reloading=true;
    location.reload();
  });
}

// Restore active mock if valid
if(state.activeMock && DATA.mocks?.[state.activeMock.mock]){
  // Keep it resumable, don't force open.
}
render();
})();

</script>
