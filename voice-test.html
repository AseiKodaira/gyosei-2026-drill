<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <title>Style-Bert-VITS2 法律用語 発音テスト</title>
  <style>
    :root{--navy:#17365d;--bg:#f5f7fb;--card:#fff;--line:#e4e8ef;--ink:#172033;--muted:#667085;--green:#138a53;--red:#b42318}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;padding-bottom:40px}
    main{max-width:720px;margin:0 auto;padding:18px 14px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:22px;margin:0}
    .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);font-weight:800}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
    .lead{font-size:14px;line-height:1.7}
    .term-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    .term{font-size:21px;font-weight:900;color:var(--navy);margin-bottom:5px}
    .reading{font-size:13px;color:var(--muted);line-height:1.6}
    .meta{font-size:11px;color:var(--muted);line-height:1.6}
    .tag{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#eef3f8;color:var(--navy);font-size:10px;font-weight:800}
    button{border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-weight:850;min-height:46px;padding:10px 16px}
    .note{font-size:12px;line-height:1.7;color:var(--muted)}
    .ready{color:var(--green);font-weight:800}
    .status{font-size:12px;margin-top:8px}
  </style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="./index.html">← 学習アプリへ</a>
    <span style="font-size:11px;color:#667085">発音ゲート</span>
  </div>

  <div class="card">
    <h1>Style-Bert-VITS2 法律用語6語テスト</h1>
    <p class="lead">文章にも4拍にもまだしません。まず法律用語6語を単語単体で正しく発音できるかだけ確認します。</p>
    <p class="note">今回は読みをひらがなで固定したうえで、さらに <strong>音素列（given_phone）とアクセント列（given_tone）を明示</strong>して生成しています。単なる「かな入力」より強く発音を固定しています。</p>
    <div class="status" id="status">読み込み中…</div>
  </div>

  <div id="terms"></div>

  <div class="card">
    <div class="note" id="engineMeta"></div>
  </div>
</main>

<script>
let currentAudio=null;

function stopAudio(){
  if(currentAudio){
    try{currentAudio.pause();currentAudio.currentTime=0;}catch(e){}
    currentAudio=null;
  }
}

async function play(src,button){
  stopAudio();
  document.querySelectorAll('button[data-play]').forEach(b=>b.textContent='▶ 再生');
  try{
    const a=new Audio(src+'?v='+Date.now());
    currentAudio=a;
    button.textContent='■ 再生中';
    a.onended=()=>{button.textContent='▶ 再生';if(currentAudio===a)currentAudio=null;};
    a.onerror=()=>{button.textContent='▶ 再生';};
    await a.play();
  }catch(e){
    button.textContent='▶ 再生';
  }
}

async function load(){
  const status=document.getElementById('status');
  try{
    const r=await fetch('./audio/sbv2-legal-terms/manifest.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('manifest');
    const m=await r.json();
    const items=m.items||[];
    document.getElementById('terms').innerHTML=items.map((v,i)=>`
      <div class="card term-card">
        <div>
          <div class="term">${i+1}. ${v.term}</div>
          <div class="reading">固定読み：${v.reading}</div>
          <div class="meta">音素：${(v.phones||[]).join(' ')}</div>
          <span class="tag">音素・アクセント固定</span>
        </div>
        <button data-play="${i}" data-src="${v.src}">▶ 再生</button>
      </div>
    `).join('');
    document.querySelectorAll('button[data-play]').forEach(b=>{
      b.onclick=()=>play(b.dataset.src,b);
    });
    status.innerHTML=items.length===6
      ? '<span class="ready">6語すべて生成済み。1語ずつ発音を確認できます。</span>'
      : '音声データが不足しています。';
    document.getElementById('engineMeta').textContent=
      'エンジン：'+(m.engine||'')+' / モデル：'+(m.model||'')+
      ' / モデルライセンス：'+(m.modelLicense||'');
  }catch(e){
    status.textContent='発音テストデータを読み込めませんでした。';
  }
}
load();
</script>
</body>
</html>
