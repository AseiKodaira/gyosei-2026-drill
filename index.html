  <style>
:root{
  --navy:#17365d;--blue:#2f75b5;--blue2:#eaf3fb;--ink:#172033;--muted:#667085;
  --bg:#f5f7fb;--card:#fff;--line:#e4e8ef;--green:#138a53;--greenbg:#e9f7ef;
  --red:#c73a32;--redbg:#fff0ef;--amber:#a15c00;--amberbg:#fff6df;--shadow:0 8px 30px rgba(23,54,93,.08);
  --radius:18px;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh;padding-bottom:88px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:rgba(245,247,251,.94);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(228,232,239,.7)}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--blue);font-weight:800;text-transform:uppercase}.topbar h1{font-size:22px;margin:2px 0 0;line-height:1.2}.icon-btn{border:0;background:var(--card);border-radius:50%;width:42px;height:42px;box-shadow:var(--shadow);font-size:22px;color:var(--navy)}
.main{max-width:820px;margin:0 auto;padding:16px 14px 28px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}
.nav-btn{border:0;background:none;color:#7a8495;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;min-height:50px;border-radius:12px}.nav-btn span{font-size:20px}.nav-btn small{font-size:10px;font-weight:700}.nav-btn.active{color:var(--navy);background:#edf3fa}
.hero{background:linear-gradient(135deg,var(--navy),#265b91);color:white;border-radius:24px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-55px;top:-75px}.countdown{font-size:38px;font-weight:900;letter-spacing:-.04em;margin:8px 0 2px}.hero .sub{opacity:.82;font-size:13px}.hero-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}.hero-stat strong{display:block;font-size:20px}.hero-stat span{font-size:11px;opacity:.78}
.section-title{font-size:15px;margin:22px 2px 10px;font-weight:900;color:#27364d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 2px 8px rgba(31,41,55,.035)}.card.clickable{cursor:pointer;transition:.12s ease}.card.clickable:active{transform:scale(.985)}.card h3{margin:0 0 6px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.metric{font-size:28px;font-weight:900;color:var(--navy);line-height:1}.metric-label{font-size:11px;color:var(--muted);margin-top:5px}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:var(--blue2);color:var(--navy)}.badge.red{background:var(--redbg);color:var(--red)}.badge.green{background:var(--greenbg);color:var(--green)}.badge.amber{background:var(--amberbg);color:var(--amber)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;background:var(--navy);color:white;min-height:46px}.btn.secondary{background:#eaf1f8;color:var(--navy)}.btn.outline{background:white;color:var(--navy);border:1px solid #bed0e1}.btn.danger{background:var(--red)}.btn.full{width:100%}.btn-row{display:flex;gap:9px;flex-wrap:wrap}.btn:disabled{opacity:.45;cursor:not-allowed}
.progressbar{height:9px;background:#e8edf4;border-radius:999px;overflow:hidden}.progressbar>i{display:block;height:100%;background:var(--blue);border-radius:999px}.list{display:flex;flex-direction:column;gap:8px}.list-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;align-items:center;gap:10px}.list-row .grow{flex:1;min-width:0}.list-row strong{font-size:13px}.list-row p{font-size:11px;color:var(--muted);margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank{width:28px;height:28px;border-radius:9px;background:#eef3f9;color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.score-pill{font-size:11px;font-weight:900;color:var(--red);background:var(--redbg);padding:5px 8px;border-radius:999px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;font-weight:800;color:var(--muted)}.field select,.field input,.field textarea{width:100%;border:1px solid #ccd5e2;border-radius:12px;background:white;padding:11px;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}
.study-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.question-card{background:white;border-radius:20px;padding:18px;border:1px solid var(--line);box-shadow:var(--shadow)}.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.q-stem{white-space:pre-wrap;font-size:15px;line-height:1.75;font-weight:700;margin:0 0 16px}.choice-list{display:flex;flex-direction:column;gap:9px}.choice{width:100%;text-align:left;border:1px solid #cfd7e3;background:#fff;border-radius:14px;padding:13px 14px;line-height:1.55;color:var(--ink)}.choice.selected{border-color:var(--blue);background:#edf5fc}.choice.correct{border-color:#69bd8d;background:var(--greenbg)}.choice.wrong{border-color:#e19a95;background:var(--redbg)}.choice .num{font-weight:900;color:var(--navy);margin-right:8px}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f7f9fc;border:1px solid var(--line)}.feedback.good{background:var(--greenbg);border-color:#bde3cd}.feedback.bad{background:var(--redbg);border-color:#efc0bc}.feedback h4{margin:0 0 6px;font-size:14px}.feedback p{margin:0;font-size:12px;line-height:1.65;white-space:pre-wrap}.confidence{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.conf-btn{border:1px solid #cbd5e1;background:white;border-radius:12px;padding:10px;font-size:12px;font-weight:800}.conf-btn[data-c="understood"]{color:var(--green)}.conf-btn[data-c="none"]{color:var(--red)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tf button{padding:20px 10px;font-size:18px}.wordbank{font-size:12px;line-height:1.8;padding:12px;background:#f5f7fb;border-radius:12px;margin-bottom:12px}.multi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mock-timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--red);background:var(--redbg);padding:7px 10px;border-radius:10px}.mock-nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.mock-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:14px}.mock-grid button{border:0;border-radius:7px;background:#e9edf3;color:#536174;font-size:10px;height:28px}.mock-grid button.done{background:#dbece4;color:var(--green)}.mock-grid button.current{background:var(--navy);color:white}.mock-grid button.unknown{background:#fff0c7;color:#8b5a00;font-weight:900}.result-big{text-align:center;padding:20px}.result-big .num{font-size:54px;font-weight:950;color:var(--navy)}.thresholds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.threshold{border-radius:12px;padding:11px;text-align:center;background:#f6f8fb}.threshold strong{display:block;font-size:18px}.threshold.ok{background:var(--greenbg);color:var(--green)}.threshold.ng{background:var(--redbg);color:var(--red)}
.mnemonic{font-size:20px;line-height:1.7;font-weight:900;text-align:center;padding:25px 10px;color:var(--navy)}
.rap-box{margin-top:12px;padding:15px;border-radius:16px;background:linear-gradient(135deg,#fff7df,#fffdf7);border:1px solid #efcf82}
.rap-label{font-size:11px;font-weight:900;color:#8b5a00;letter-spacing:.05em;margin-bottom:7px}
.rap-phrase{font-size:18px;line-height:1.65;font-weight:950;color:#4b3600}
.rap-hint{font-size:11px;color:#7a6850;margin-top:6px}
.rap-actions{display:flex;gap:8px;margin-top:10px}.rap-actions .btn{flex:1}
.reveal{filter:blur(9px);user-select:none;transition:.2s}.reveal.show{filter:none;user-select:auto}.settings-block{margin-bottom:12px}.note{font-size:11px;color:var(--muted);line-height:1.6}.danger-zone{border-color:#f0c6c2}.empty{text-align:center;color:var(--muted);padding:30px 10px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#172033;color:white;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:70;display:flex;align-items:flex-end;justify-content:center}.modal{background:white;width:min(720px,100%);max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 12px}.divider{height:1px;background:var(--line);margin:14px 0}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:620px;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.main{padding-bottom:35px}.modal{border-radius:24px;margin-bottom:20px}.modal-backdrop{align-items:center}.confidence{grid-template-columns:repeat(4,1fr)}}

  <script>
window.GYOSEI_DATA={"mocks":{"mock1":[{"id":"MOCK1-01","mock":"mock1","no":1,"format":"5肢択一","section":"法令等","subject":"基礎法学","field":"法の分類","stem":"法の分類に関する次の記述のうち、妥当なものはどれか。","choices":["民事訴訟法は、私人間の権利義務そのものを定める実体法である。","民法は、裁判手続を定める手続法である。","刑法は、私人間の契約関係を中心に規律する私法である。","民事訴訟法は、民事上の権利義務を裁判上実現するための手続を定める手続法である。","任意規定は、当事者の合意によって適用を排除することができない。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"実体法は権利義務の内容、手続法はその実現手続を規律する。民事訴訟法は典型的な手続法。","source":"https://laws.e-gov.go.jp/law/408AC0000000109?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-02","mock":"mock1","no":2,"format":"5肢択一","section":"法令等","subject":"基礎法学","field":"法解釈・罪刑法定主義","stem":"法解釈に関する次の記述のうち、妥当なものはどれか。","choices":["文理解釈は、条文の文言を離れて立法目的だけから意味を決める方法である。","刑罰法規を被告人に不利益な方向へ類推適用することは、罪刑法定主義との関係で原則として許されない。","反対解釈と類推解釈は常に同一の結論に至る。","当然解釈は、必ず条文の適用範囲を拡張する。","条約は日本国憲法に優越する。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"刑罰法規の不利益な類推は罪刑法定主義に反する。憲法は国内法秩序の最高法規。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-03","mock":"mock1","no":3,"format":"5肢択一","section":"法令等","subject":"憲法","field":"表現の自由","stem":"表現の自由に関する次の記述のうち、妥当なものはどれか。","choices":["憲法は、表現の自由について明文の保障を置いていない。","憲法21条2項は、検閲を禁止している。","通信の秘密は、法律によって自由に侵害することができる。","表現内容の事前規制は、事後規制より常に緩やかに審査される。","集会・結社の自由は経済的自由権に分類される。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"憲法21条は表現・集会・結社の自由を保障し、2項で検閲禁止と通信の秘密を定める。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-04","mock":"mock1","no":4,"format":"5肢択一","section":"法令等","subject":"憲法","field":"法の下の平等","stem":"憲法14条の法の下の平等について、妥当なものはどれか。","choices":["あらゆる区別は一切許されない。","私人間のすべての差別的取扱いを憲法14条が直接無効にする。","合理的な理由のない差別的取扱いが禁止されると解されている。","法人には平等原則は一切及ばない。","性別による取扱いの区別は、目的のいかんを問わずすべて違憲である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"平等原則は、合理的理由のない差別的取扱いを禁ずる趣旨と解される。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-05","mock":"mock1","no":5,"format":"5肢択一","section":"法令等","subject":"憲法","field":"司法権・違憲審査","stem":"日本の違憲審査制に関する次の記述のうち、妥当なものはどれか。","choices":["最高裁判所は、具体的事件と無関係に法令の合憲性だけを抽象的に審査することを主たる任務とする。","違憲審査権は最高裁判所だけに認められ、下級裁判所には認められない。","国会の制定した法律について裁判所は憲法適合性を審査できない。","裁判所は、具体的な争訟の解決に必要な範囲で法令の憲法適合性を審査する。","最高裁判所は行政機関に属する。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"日本は具体的争訟を前提とする付随的違憲審査制を採ると理解されている。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-06","mock":"mock1","no":6,"format":"5肢択一","section":"法令等","subject":"憲法","field":"国会・内閣","stem":"内閣と衆議院の関係について、妥当なものはどれか。","choices":["衆議院が内閣不信任決議をしても、内閣は何ら対応する必要がない。","内閣不信任決議が可決された場合、内閣は必ず即日総辞職しなければならない。","内閣不信任決議が可決された場合、10日以内に衆議院が解散されない限り、内閣は総辞職しなければならない。","参議院だけが内閣不信任決議を行うことができる。","内閣総理大臣は最高裁判所が指名する。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"憲法69条。不信任可決または信任否決後、10日以内に衆議院解散がなければ内閣総辞職。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-07","mock":"mock1","no":7,"format":"5肢択一","section":"法令等","subject":"憲法","field":"地方自治","stem":"地方自治に関する次の記述のうち、妥当なものはどれか。","choices":["地方公共団体の長は、すべて国が任命する。","一の地方公共団体のみに適用される特別法には、法律の定めるところにより当該地方公共団体の住民投票で過半数の同意が必要である。","地方公共団体に条例制定権は認められていない。","地方議会議員は国会が選任する。","地方自治の本旨は憲法上言及されていない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"憲法95条の地方自治特別法の住民投票。地方自治の本旨は92条。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-08","mock":"mock1","no":8,"format":"5肢択一","section":"法令等","subject":"行政法","field":"取消し・撤回","stem":"行政行為の取消しと撤回について、妥当なものはどれか。","choices":["撤回は、処分成立時から存在した違法を理由に遡及的に効力を失わせることをいう。","取消しは、適法に成立した処分を後発事情だけを理由に将来へ向け失効させることをいう。","撤回は、適法に成立した処分を後発事情等により将来に向かって効力を失わせるものをいう。","授益的処分の撤回には常に個別法律の明文根拠が必要である。","争訟裁断的処分には不可変更力が問題となる余地がない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"取消しは原始的瑕疵、撤回は後発事情という区別が基本。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-09","mock":"mock1","no":9,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政裁量","stem":"行政裁量の司法審査について、妥当なものはどれか。","choices":["裁量行為は裁判所の審査対象とならない。","裁量処分は、法律の根拠があれば理由を問わず適法となる。","裁量の逸脱・濫用があっても取消原因とはならない。","考慮すべき事項を考慮しないなど判断過程に著しい不合理があれば、裁量権の逸脱・濫用として違法となり得る。","行政庁に裁量が認められる場合、裁判所は常に行政庁と同一の立場で最も適切な結論を選び直す。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"裁量処分でも裁量権の逸脱・濫用は司法審査の対象。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-10","mock":"mock1","no":10,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政強制","stem":"行政上の義務履行確保について、妥当なものはどれか。","choices":["行政代執行は、金銭納付義務の履行確保を目的とする。","行政代執行は、他人が代わって行うことのできる作為義務の不履行について問題となる。","直接強制には行政代執行法による一般的根拠がある。","執行罰は刑罰であるため同一義務不履行について反復できない。","即時強制は必ず既存の行政上の義務の不履行を前提とする。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"代執行は代替的作為義務が中心。直接強制・執行罰には一般法による包括的根拠はない。","source":"https://laws.e-gov.go.jp/law/323AC0000000043?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-11","mock":"mock1","no":11,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"審査基準・標準処理期間","stem":"行政手続法上の申請に関する次の記述のうち、妥当なものはどれか。","choices":["審査基準の設定は努力義務である。","標準処理期間は必ず設定しなければならない。","標準処理期間を定めても公表する必要はない。","審査基準は設定義務であり、標準処理期間は設定努力義務である。","申請拒否処分は不利益処分に含まれる。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"審査基準＝設定義務。標準処理期間＝設定努力義務。申請拒否は申請に対する処分。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-12","mock":"mock1","no":12,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"聴聞・弁明","stem":"聴聞と弁明の機会について、妥当なものはどれか。","choices":["弁明は常に口頭で行う。","聴聞でも弁明でも原因事実を証する資料の閲覧制度が同一に設けられている。","聴聞では、当事者等に一定の文書閲覧制度が認められている。","申請拒否処分には原則として弁明の機会が必要である。","聴聞の主宰者は必ず処分庁の長自身でなければならない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"聴聞には資料閲覧、陳述、証拠提出、調書等の手続保障がある。弁明は原則書面。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-13","mock":"mock1","no":13,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"行政指導","stem":"行政指導について、妥当なものはどれか。","choices":["相手方が従わない場合、行政機関はそのことだけを理由に不利益取扱いをしてよい。","行政指導は相手方の任意の協力によってのみ実現されるべきである。","行政指導は必ず行政処分である。","行政指導には行政手続法の規律はない。","行政指導の担当者は、相手方から求められても趣旨・内容・責任者を示す必要がない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行政指導の根本は任意性。不利益取扱禁止や明示義務などがある。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-14","mock":"mock1","no":14,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"審査請求期間","stem":"処分についての審査請求期間に関する次の記述のうち、妥当なものはどれか。","choices":["処分を知った日の翌日から原則30日以内である。","処分を知った日の翌日から原則3か月以内である。","処分の日の翌日から10年以内ならいつでもできる。","正当な理由による期間徒過の例外は一切ない。","審査請求期間は行政庁が自由に定める。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"主観的期間は原則3か月、客観的期間は原則1年。いずれも正当な理由の例外がある。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-15","mock":"mock1","no":15,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"審理員","stem":"審理員について、妥当なものはどれか。","choices":["審理員候補者名簿の作成は必ず行わなければならない。","審理員は、処分庁に対して直接執行停止を命じる。","審理員は、審理終結後に裁決意見書を作成する。","行政不服審査会へ諮問する主体は審理員である。","再調査の請求でも必ず審理員を指名する。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"候補者名簿は努力義務。裁決意見書を審査庁へ提出し、諮問主体は審査庁。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-16","mock":"mock1","no":16,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"執行停止","stem":"審査請求と処分の執行停止について、妥当なものはどれか。","choices":["審査請求をすると当然に処分の効力が停止する。","審査請求は原則として処分の効力等を停止しない。","執行停止の制度は行政不服審査法には存在しない。","執行停止は審査請求人から申し立てることができない。","審理員の意見があれば審査庁は必ず執行停止しなければならない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"原則は執行不停止。一定の場合に申立て・職権による停止が問題となる。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-17","mock":"mock1","no":17,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"処分性","stem":"取消訴訟の対象となる「処分」に関する次の記述のうち、妥当なものはどれか。","choices":["行政機関の行為であれば、国民の権利義務に影響しなくてもすべて処分となる。","行政指導は必ず処分となる。","公権力の行使として、直接国民の権利義務を形成し又はその範囲を確定する性質の行為が中心となる。","条例制定行為は常に処分となる。","事実上の不利益があれば法律効果がなくても必ず処分となる。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"処分性は公権力性と直接具体的な法的効果が基本軸。判例で例外的に処分性が認められる行為もある。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-18","mock":"mock1","no":18,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"原告適格・訴えの利益","stem":"取消訴訟について、妥当なものはどれか。","choices":["処分に事実上反対する者であれば誰でも提起できる。","処分の相手方以外に原告適格が認められることはない。","処分の取消しを求めるにつき法律上の利益を有する者が提起できる。","処分の効果が消滅すれば、回復すべき利益があっても必ず訴えの利益を失う。","原告適格は処分庁が決定する。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"法律上の利益が中心。処分後も回復すべき利益が残れば訴えの利益が認められることがある。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-19","mock":"mock1","no":19,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"差止め・仮の救済","stem":"差止め訴訟と仮の差止めについて、妥当なものはどれか。","choices":["本案の差止め訴訟には「償うことのできない損害」が要件となる。","仮の差止めには「償うことのできない損害を避けるため緊急の必要」が問題となる。","仮の差止めは本案訴訟を提起せず単独で申し立てられる。","仮の差止めでは本案について理由があるとみえる必要はない。","公共の福祉に重大な影響を及ぼすおそれがあっても命じなければならない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"本案差止めは重大な損害、仮の差止めは償うことのできない損害＋緊急性が中心。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-20","mock":"mock1","no":20,"format":"5肢択一","section":"法令等","subject":"国家賠償法","field":"1条・2条","stem":"国家賠償法について、妥当なものはどれか。","choices":["1条は公の営造物の設置管理瑕疵を定める。","2条は公務員の違法な公権力行使を定める。","1条は公務員の違法な公権力行使、2条は公の営造物の設置管理瑕疵を中心に定める。","地方公共団体には適用されない。","道路は2条の公の営造物に含まれない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"1条＝公務員の違法な公権力行使、2条＝営造物。","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-21","mock":"mock1","no":21,"format":"5肢択一","section":"法令等","subject":"国家賠償法","field":"規制権限不行使","stem":"行政庁の規制権限不行使と国家賠償について、妥当なものはどれか。","choices":["規制権限を行使しなかった場合、常に国賠法上違法となる。","規制権限の不行使は国賠法上違法となることはない。","規制権限の不行使による国賠責任は、被害が生じたことだけで当然に成立する。","法の趣旨・目的や被害の性質等に照らし、権限不行使が許容限度を逸脱して著しく合理性を欠く場合には違法となり得る。","違法性の判断では権限行使の可能性は一切考慮されない。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"規制権限不行使は、法の趣旨・目的や具体的事情を踏まえ、著しく合理性を欠く場合に違法となり得る。","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-22","mock":"mock1","no":22,"format":"5肢択一","section":"法令等","subject":"行政法","field":"損失補償","stem":"国家賠償と損失補償の区別について、妥当なものはどれか。","choices":["損失補償は違法な公権力行使による損害の賠償を目的とする。","損失補償は、適法な公権力行使により特別の犠牲を受けた者の損失を補填する制度である。","国家賠償は適法な土地収用の対価を支払う制度である。","損失補償と国家賠償は常に同じ要件で成立する。","憲法29条3項は財産権制約に対する補償と無関係である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"国家賠償＝違法行為による損害、損失補償＝適法な公権力行使による特別犠牲。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-23","mock":"mock1","no":23,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"自治事務・法定受託事務","stem":"地方公共団体の事務について、妥当なものはどれか。","choices":["機関委任事務制度が現在も自治事務・法定受託事務と並ぶ第三分類として存続する。","法定受託事務は地方公共団体の事務ではない。","地方公共団体の事務は、自治事務と法定受託事務の区別を軸に整理される。","自治事務には条例を制定できない。","国等の関与には法律上の根拠が一切不要である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"機関委任事務は廃止され、自治事務・法定受託事務を軸に整理。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-24","mock":"mock1","no":24,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"住民監査請求・住民訴訟","stem":"住民訴訟について、妥当なものはどれか。","choices":["原則として住民監査請求を経ることなく直ちに提起できる。","住民でない者でも法律上の利害関係があれば提起できる。","原則として住民監査請求を経た住民が提起する。","勝訴による金銭は原告住民個人に帰属する。","財務会計行為とは無関係な一般行政活動全般を対象とする。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"住民訴訟は監査前置が基本で、財務会計行為等が対象。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-25","mock":"mock1","no":25,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"条例・規則","stem":"条例と規則について、妥当なものはどれか。","choices":["条例制定権は地方公共団体の長だけに属する。","普通地方公共団体は、法令に違反しない限り、その事務に関し条例を制定することができる。","長は規則を制定できない。","条例には罰則を設けることが一切できない。","条例は法律に優越する。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"地方自治法14条。長の規則制定権は15条。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-26","mock":"mock1","no":26,"format":"5肢択一","section":"法令等","subject":"行政法","field":"情報公開","stem":"行政機関情報公開法について、妥当なものはどれか。","choices":["何人も、行政機関が保有する行政文書の開示を請求することができる。","開示請求者は日本国籍を有する者に限られる。","行政機関は開示請求に応じるため、新しい文書を作成しなければならない。","一部に不開示情報が含まれれば文書全部を必ず不開示にする。","個人識別情報は例外なくすべて開示される。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"開示請求権者は「何人も」。部分開示制度があり、新規文書作成義務はない。","source":"https://laws.e-gov.go.jp/law/411AC0000000042?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-27","mock":"mock1","no":27,"format":"5肢択一","section":"法令等","subject":"民法","field":"制限行為能力","stem":"未成年者の法律行為について、妥当なものはどれか。","choices":["未成年者は、いかなる法律行為も単独でできない。","単に権利を得、又は義務を免れる法律行為は、法定代理人の同意なくすることができる。","未成年者の法律行為はすべて当然無効である。","法定代理人の同意を得た法律行為も未成年者はいつでも自由に取り消せる。","未成年者が成年者であると信じさせる詐術を用いても取消権は失われない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"単に権利を得又は義務を免れる行為は同意不要。その他は原則同意が必要で、取消し得る。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-28","mock":"mock1","no":28,"format":"5肢択一","section":"法令等","subject":"民法","field":"無権代理・追認","stem":"無権代理行為の追認について、妥当なものはどれか。","choices":["本人は無権代理行為を追認できない。","追認は、別段の意思表示がない限り契約時に遡って効力を生ずるが、第三者の権利を害することはできない。","追認は将来に向かってのみ効力を生ずる。","相手方だけが追認できる。","追認には必ず家庭裁判所の許可が必要である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"追認は原則遡及効。ただし第三者の権利を害せない。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-29","mock":"mock1","no":29,"format":"5肢択一","section":"法令等","subject":"民法","field":"共有","stem":"共有物について、妥当なものはどれか。","choices":["共有物の保存行為は常に共有者全員の同意が必要である。","管理に関する事項は共有者の人数の過半数で決する。","各共有者は単独で共有物の保存行為をすることができる。","管理に関する事項は常に全員一致で決する。","共有者の持分の価格は管理事項の決定に関係しない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"保存行為は各共有者が単独で可能。管理事項は原則として持分価格の過半数。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-30","mock":"mock1","no":30,"format":"5肢択一","section":"法令等","subject":"民法","field":"即時取得","stem":"動産の即時取得について、妥当なものはどれか。","choices":["相続による占有承継だけで即時取得できる。","占有改定だけで直ちに即時取得が成立する。","取引行為により、平穏・公然・善意無過失で動産の占有を取得すること等が基本要件となる。","未成年者からの売買が取り消されても、買主は常に即時取得で保護される。","登録の有無を問わず自動車はすべて即時取得の対象外である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"即時取得は取引安全保護制度。取引行為・占有取得・善意無過失が軸。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-31","mock":"mock1","no":31,"format":"5肢択一","section":"法令等","subject":"民法","field":"債権者代位権","stem":"債権者代位権について、妥当なものはどれか。","choices":["代位債権者は債務者の代理人として権利を行使する。","被保全債権の期限前は保存行為も一切代位できない。","債権者は、自己の債権を保全するため、自己の名で債務者の権利を行使する制度である。","債権者が代位行使すると、債務者は自己の権利を行使できなくなる。","形成権は一切代位行使の対象にならない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"債権者代位権は債権者自身の権利として行使。債務者本人の権利行使も当然には妨げない。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-32","mock":"mock1","no":32,"format":"5肢択一","section":"法令等","subject":"民法","field":"債権譲渡・相殺","stem":"債権譲渡と相殺について、妥当なものはどれか。","choices":["債権譲渡の通知前に取得した反対債権でも、譲受人に相殺を一切主張できない。","所定の要件を満たす反対債権による相殺を、譲受人に対抗できる場合がある。","債権譲渡後は相殺制度は適用されない。","二重譲渡通知が同時到達すれば譲渡債権は消滅する。","債権譲渡には常に債務者の承諾が必要である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"相殺対抗の可否は反対債権の取得時期や発生原因などで決まる。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-33","mock":"mock1","no":33,"format":"5肢択一","section":"法令等","subject":"民法","field":"賃貸借","stem":"賃借権の譲渡・転貸について、妥当なものはどれか。","choices":["賃借人は賃貸人の承諾なく自由に賃借権を譲渡できる。","賃借人は賃貸人の承諾なく自由に賃借物を転貸できる。","賃借人は原則として賃貸人の承諾を得なければ、賃借権を譲渡し又は賃借物を転貸できない。","無断転貸があっても賃貸人に解除権は一切認められない。","転貸は民法ではなく借地借家法にのみ規定されている。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"民法612条。もっとも解除には信頼関係破壊法理による判例上の制約が問題となる。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-34","mock":"mock1","no":34,"format":"5肢択一","section":"法令等","subject":"民法","field":"不法行為・使用者責任","stem":"使用者責任について、妥当なものはどれか。","choices":["使用者責任が成立すると、被用者本人の不法行為責任は当然に消滅する。","被用者が事業の執行について第三者に損害を与えても、使用者は一切責任を負わない。","使用者は被害者に賠償した場合、常に被用者へ全額求償できる。","使用者責任が成立しても、被用者本人の不法行為責任が当然に消滅するわけではない。","使用者責任は契約責任であり不法行為責任ではない。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"使用者と被用者の双方が被害者に責任を負い得る。使用者の被用者への求償は相当範囲に制限され得る。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-35","mock":"mock1","no":35,"format":"5肢択一","section":"法令等","subject":"民法","field":"2026親族法改正","stem":"2026年4月1日施行の改正民法による離婚後の親権について、妥当なものはどれか。","choices":["離婚後は必ず父母の一方だけを親権者としなければならない。","離婚後、子の利益の観点から父母双方を親権者と定めることができる制度が設けられた。","父母双方が親権者なら日常の監護教育行為も常に共同で行う必要がある。","子の利益のため急迫の事情があっても一方による単独行使はできない。","この改正は2027年4月1日施行である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"2026年4月1日施行。共同親権の場合でも日常行為・急迫事情では単独行使が認められる。","source":"https://www.moj.go.jp/MINJI/parents_007.html","difficulty":"","category":""},{"id":"MOCK1-36","mock":"mock1","no":36,"format":"5肢択一","section":"法令等","subject":"商法","field":"商人","stem":"商法上の商人に関する次の記述のうち、妥当なものはどれか。","choices":["自己の名をもって商行為をすることを業とする者は商人に当たらない。","自己の名をもって商行為をすることを業とする者は、商法上の商人である。","会社は商法・会社法上の規律を受けない。","商人の営業に関する行為に商法が適用されることはない。","商人は自然人に限られる。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"商法4条の基本。会社については会社法5条等の特則もある。","source":"https://laws.e-gov.go.jp/law/132AC0000000048?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-37","mock":"mock1","no":37,"format":"5肢択一","section":"法令等","subject":"会社法","field":"株式会社の設立","stem":"株式会社の設立について、妥当なものはどれか。","choices":["発起人は設立時発行株式を1株も引き受けなくてよい。","株式会社は定款を作成せずに設立できる。","各発起人は、設立時発行株式を1株以上引き受けなければならない。","発起人は法人になることができない。","株式会社の設立には必ず公開会社であることが必要である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"発起人は少なくとも1株を引き受ける。定款作成は必須。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-38","mock":"mock1","no":38,"format":"5肢択一","section":"法令等","subject":"会社法","field":"株式の譲渡制限","stem":"株式会社の株式について、妥当なものはどれか。","choices":["株式会社は定款によって株式の譲渡を一切制限できない。","株式会社は、定款で譲渡による株式取得について会社の承認を要する旨を定めることができる。","公開会社とは全株式に譲渡制限がある会社をいう。","株券発行会社ではない会社の株式は譲渡できない。","株式の譲渡には常に株主総会の特別決議が必要である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"定款による譲渡制限が可能。公開会社は全部の株式に譲渡制限を設けていない会社。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-39","mock":"mock1","no":39,"format":"5肢択一","section":"法令等","subject":"会社法","field":"取締役の義務","stem":"取締役の義務について、妥当なものはどれか。","choices":["取締役は会社に対して善管注意義務を負わない。","取締役は株主個人にのみ忠実義務を負い会社には負わない。","取締役は会社に対し善管注意義務・忠実義務を負う。","取締役は競業取引・利益相反取引について会社法上の規律を受けない。","取締役の任務懈怠責任はどのような場合でも免除できない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"取締役は会社との委任関係に基づく善管注意義務と忠実義務を負う。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-40","mock":"mock1","no":40,"format":"5肢択一","section":"法令等","subject":"会社法","field":"株主総会・定款変更","stem":"株主総会に関する次の記述のうち、妥当なものはどれか。","choices":["定款変更は取締役会だけで行うことができる。","株式会社は定款を変更することができない。","定款変更は常に普通決議で足りる。","定款変更は原則として株主総会の特別決議を要する。","株主総会は会社の組織・運営について一切決議できない。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"定款変更は会社法上の特別決議事項。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-41","mock":"mock1","no":41,"format":"多肢選択","section":"法令等","subject":"憲法","field":"司法権・違憲審査","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n裁判所法3条にいう［ア］の争訟とは、当事者間の具体的な権利義務又は法律関係の存否に関する紛争であり、法令の適用によって終局的に解決できるものをいう。日本の違憲審査は、具体的事件の解決に必要な範囲で憲法適合性を審査する［イ］審査制を基本とする。最高裁判所は法令等の憲法適合性を決定する［ウ］裁判所であり、裁判官はその良心に従い［エ］して職権を行う。","choices":[],"wordbank":"1.法律上　2.付随的　3.終審　4.独立　5.抽象的　6.具体的　7.政治的　8.行政的　9.一般的　10.司法上　11.公開　12.法定　13.裁量的　14.民主的　15.最高　16.特別　17.事実上　18.部分的　19.補充的　20.統一的","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=法律上、イ=付随的、ウ=終審、エ=独立。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-42","mock":"mock1","no":42,"format":"多肢選択","section":"法令等","subject":"行政法","field":"行政手続法","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n申請により求められた許認可等をするかどうかを法令の定めに従って判断するための基準を［ア］という。申請が到達してから処分までに通常要すべき標準的な期間を［イ］という。不利益処分をするかどうか又はどのような不利益処分とするかについての基準を［ウ］という。行政機関が一定の行政目的の実現を図るため、特定の者に一定の作為又は不作為を求める非権力的作用を［エ］という。","choices":[],"wordbank":"1.審査基準　2.標準処理期間　3.処分基準　4.行政指導　5.弁明　6.聴聞　7.申請　8.届出　9.許認可　10.努力義務　11.法的義務　12.不利益処分　13.命令等　14.理由提示　15.代理人　16.参加人　17.閲覧　18.裁決　19.審理員　20.公聴会","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=審査基準、イ=標準処理期間、ウ=処分基準、エ=行政指導。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-43","mock":"mock1","no":43,"format":"多肢選択","section":"法令等","subject":"行政法","field":"行政事件訴訟法","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n取消訴訟の提起は、原則として処分の［ア］を妨げない。そこで、一定の要件の下で裁判所が処分の効力、執行又は手続の続行を止める［イ］の制度が設けられている。他方、本案の差止め訴訟では［ウ］損害を生ずるおそれが問題となり、仮の差止めでは［エ］損害を避けるため緊急の必要があることが要件となる。","choices":[],"wordbank":"1.効力　2.執行停止　3.重大な　4.償うことのできない　5.緊急の　6.裁決　7.処分性　8.法律上　9.仮の義務付け　10.仮の差止め　11.原告適格　12.義務付け　13.出訴期間　14.訴えの利益　15.行政指導　16.取消判決　17.拘束力　18.公共の福祉　19.理由　20.職権","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=効力、イ=執行停止、ウ=重大な、エ=償うことのできない。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-44","mock":"mock1","no":44,"format":"記述式","section":"法令等","subject":"行政法","field":"義務付け訴訟・仮の義務付け","stem":"Xは、法令上許可を要する事業について行政庁に申請したが、違法に拒否処分を受けた。Xは、最終的に許可処分を得ることを求め、かつ本案判決まで待つと償うことのできない損害が生ずる緊急の必要がある。Xが提起すべき本案訴訟と申し立てるべき仮の救済を、40字程度で記述しなさい。","choices":[],"wordbank":"","points":20,"answers":[],"model":"拒否処分取消訴訟と申請型義務付け訴訟を併合提起し、仮の義務付けを申し立てる。","explanation":"申請型義務付けは拒否処分の取消し等と併合し、仮の救済として仮の義務付けが問題となる。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-45","mock":"mock1","no":45,"format":"記述式","section":"法令等","subject":"民法","field":"2026法定養育費","stem":"AとBは2026年5月に離婚した。未成年の子Cについて、離婚時に養育費の取決めをしておらず、Aが離婚時から引き続きCを主として監護している。AはBに対し、取決めがされるまで、どのような請求をすることができるか。40字程度で記述しなさい。","choices":[],"wordbank":"","points":20,"answers":[],"model":"法定養育費として、子一人につき月額二万円を、養育費の取決めまで請求できる。","explanation":"2026年4月1日以後の離婚で、主として子を監護する父母は、取決めまで子1人月2万円を請求できる。","source":"https://www.moj.go.jp/MINJI/parents_010.html","difficulty":"","category":""},{"id":"MOCK1-46","mock":"mock1","no":46,"format":"記述式","section":"法令等","subject":"民法","field":"賃貸借・無断転貸","stem":"Aは建物をBに賃貸した。BはAの承諾なくCに建物を転貸した。Aが民法612条により賃貸借を解除しようとする場合、判例上どのような制約があるか。40字程度で記述しなさい。","choices":[],"wordbank":"","points":20,"answers":[],"model":"原則解除できるが、背信行為と認めるに足りない特段の事情があれば解除できない。","explanation":"無断転貸でも、賃貸人に対する背信行為と認めるに足りない特段の事情がある場合には解除できない。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-47","mock":"mock1","no":47,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"住民投票・地方自治","stem":"日本の住民投票に関する次の記述のうち、妥当なものはどれか。","choices":["日本国憲法には住民投票に関する規定が一切ない。","一の地方公共団体のみに適用される特別法には、法律の定めるところにより当該地方公共団体の住民投票で過半数の同意が必要である。","条例に基づく住民投票の結果は、国会を法的に拘束する。","国政について国民が法律案を直接可決する一般的制度がある。","地方公共団体の長の解職請求に住民投票は利用されない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"憲法95条。一般的な条例住民投票とは別に、地方自治特別法について住民の同意を要求する。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK1-48","mock":"mock1","no":48,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"国際経済・WTO","stem":"WTOの基本原則に関する次の記述のうち、妥当なものはどれか。","choices":["最恵国待遇とは、特定国だけに最も高い関税を課す原則である。","内国民待遇とは、輸入品が国内市場に入った後、国内産品より不利に扱わないという考え方である。","WTOは自由貿易を否定し、各国に原則として輸入禁止を求めている。","最恵国待遇と内国民待遇は同一の概念である。","WTO協定はサービス貿易を対象としない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"WTOの非差別原則は、最恵国待遇と内国民待遇が中心。","source":"https://www.wto.org/english/thewto_e/whatis_e/tif_e/fact2_e.htm","difficulty":"","category":""},{"id":"MOCK1-49","mock":"mock1","no":49,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"経済・CPI","stem":"消費者物価指数（CPI）について、妥当なものはどれか。","choices":["企業が輸出する財だけの価格変動を測る指数である。","全国の世帯が購入する財・サービスの価格変動を、一定の消費構造を前提に時系列で測る指標である。","失業率を示す指標である。","株価の変動だけを表す指数である。","CPIは10年に1回しか作成されない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"総務省統計局のCPIは家計が購入する財・サービスの価格変動を測定し、毎月作成される。","source":"https://www.stat.go.jp/data/cpi/","difficulty":"","category":""},{"id":"MOCK1-50","mock":"mock1","no":50,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"人口・高齢化","stem":"日本の人口高齢化に関する用語として、妥当なものはどれか。","choices":["高齢化率とは総人口に占める15歳未満人口の割合である。","高齢化率とは総人口に占める65歳以上人口の割合である。","高齢化率とは総人口に占める75歳以上人口の割合だけをいう。","高齢化率は出生数を総人口で割った値である。","高齢化率は就業者数だけを用いて計算する。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"高齢化率は、一般に総人口に占める65歳以上人口の割合。","source":"https://www8.cao.go.jp/kourei/whitepaper/w-2025/html/gaiyou/s1_1.html","difficulty":"","category":""},{"id":"MOCK1-51","mock":"mock1","no":51,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"国際環境・パリ協定","stem":"パリ協定について、妥当なものはどれか。","choices":["2015年に採択された気候変動に関する国際枠組みである。","温室効果ガス削減目標は先進国だけが提出する。","気候変動とは無関係の貿易協定である。","国連とは無関係の民間協定である。","各締約国が自国の気候行動を示すNDCの考え方は採用されていない。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"パリ協定は2015年採択。各締約国がNDCを提出・更新する仕組みを採る。","source":"https://unfccc.int/process-and-meetings/the-paris-agreement","difficulty":"","category":""},{"id":"MOCK1-52","mock":"mock1","no":52,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"情報社会・ディープフェイク","stem":"ディープフェイクに関する次の記述のうち、妥当なものはどれか。","choices":["暗号方式の一種である。","AI等を用いて、実在人物が実際にはしていない発言・行動をしたように見せる映像・音声等を生成する技術・コンテンツを指す。","電子署名そのものをいう。","コンピュータウイルスだけを指す。","紙の文書をPDF化する技術をいう。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"生成AI等による高度な合成・改変コンテンツがディープフェイクと呼ばれる。","source":"https://security-portal.nisc.go.jp/guidance/handbook.html","difficulty":"","category":""},{"id":"MOCK1-53","mock":"mock1","no":53,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"行政書士法・2026改正","stem":"2026年1月1日施行の行政書士法改正について、妥当なものはどれか。","choices":["特定行政書士の不服申立て代理業務の範囲は、行政書士が実際に作成した書類に係る許認可等にさらに限定された。","行政書士でない者の業務制限規定から「報酬」の要素が削除された。","特定行政書士の不服申立て代理業務の範囲が、行政書士が作成することができる官公署提出書類に係る許認可等へ拡大された。","改正法の施行日は2027年1月1日である。","行政書士法人制度は廃止された。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"令和7年法律65号により、特定行政書士の不服申立て代理範囲が「作成した」から「作成することができる」書類へ拡大。","source":"https://www.shugiin.go.jp/Internet/itdb_gian.nsf/html/gian/honbun/youkou/g21705036.htm","difficulty":"","category":""},{"id":"MOCK1-54","mock":"mock1","no":54,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"戸籍・住民登録","stem":"戸籍と住民票に関する次の記述のうち、妥当なものはどれか。","choices":["戸籍は主として住所の異動だけを記録する制度である。","戸籍は日本国民の身分関係を公証する制度であり、住所は主として住民基本台帳に記録される。","外国人住民は日本人と同じ戸籍に必ず編製される。","出生・婚姻・死亡などは戸籍に一切記録されない。","戸籍事務は都道府県知事だけが行う。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"戸籍は身分関係、住民基本台帳は住所・住民の記録が中心。","source":"https://laws.e-gov.go.jp/law/322AC0000000224?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-55","mock":"mock1","no":55,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"情報セキュリティ・多要素認証","stem":"多要素認証（MFA）について、妥当なものはどれか。","choices":["同じパスワードを2回入力する方式をいう。","長いパスワード1個だけを使う方式をいう。","知識・所持・生体など異なる種類の認証要素のうち、2つ以上を組み合わせる方式をいう。","IDを2つ持つことをいう。","多要素認証を用いれば、フィッシング等への注意は一切不要になる。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"多要素認証は異なる種類の要素を組み合わせる。二段階認証と同義ではない。","source":"https://security-portal.nisc.go.jp/guidance/handbook.html","difficulty":"","category":""},{"id":"MOCK1-56","mock":"mock1","no":56,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"個人情報保護制度","stem":"個人情報保護制度について、妥当なものはどれか。","choices":["個人情報保護委員会は民間事業者を監督しない。","個人情報保護委員会はマイナンバーカードの交付事務を行う機関である。","個人情報保護法には行政機関等に関する規律は存在しない。","個人情報保護委員会は個人情報取扱事業者等に対して立入検査を行うことができる。","個人情報保護法は法人に関する情報をすべて個人情報として扱う。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"個人情報保護委員会には民間事業者等に対する監督権限がある。","source":"https://laws.e-gov.go.jp/law/415AC0000000057?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-57","mock":"mock1","no":57,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"仮名加工情報・匿名加工情報","stem":"個人情報保護法上の加工情報について、妥当なものはどれか。","choices":["匿名加工情報は、他の情報と照合すれば容易に本人を識別できる状態を前提とする。","匿名加工情報は、特定の個人を識別できず、元の個人情報を復元できないよう加工した情報をいう。","仮名加工情報と匿名加工情報は法律上まったく同じ概念である。","仮名加工情報は一切の安全管理措置が不要である。","匿名加工情報を作成した事業者には何の義務も課されない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"匿名加工情報は特定個人を識別できず、元情報を復元できないよう加工したもの。仮名加工情報とは異なる。","source":"https://laws.e-gov.go.jp/law/415AC0000000057?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK1-58","mock":"mock1","no":58,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"文章理解・要旨","stem":"次の文章の要旨として最も適切なものはどれか。\n規則を細かく定めれば、判断のばらつきを抑えることはできる。しかし、想定外の事例まで規則だけで処理しようとすると、かえって不合理な結論になることがある。他方、すべてを担当者の裁量に任せれば、判断の予測可能性が失われる。重要なのは、規則と裁量のどちらか一方を選ぶことではなく、判断基準を示し、例外的判断をするときには理由を説明できる仕組みを設けることである。","choices":["規則は細かければ細かいほど常に良い。","裁量は行政に不要である。","予測可能性を確保するにはすべてを担当者に任せるべきである。","規則と裁量を組み合わせ、例外的判断には理由の説明を求めることが重要である。","想定外の事例は法制度の対象外とすべきである。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"文章は規則か裁量かの二者択一ではなく、基準と理由説明の組合せを主張している。","source":"OpenAI作成・オリジナル文章","difficulty":"","category":""},{"id":"MOCK1-59","mock":"mock1","no":59,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"文章理解・空欄補充","stem":"次の文章の空欄に入る文として最も適切なものはどれか。\nデジタル化は、申請や審査を迅速にし、利用者の負担を軽減する可能性を持つ。手続の自動化によって、同じ情報を何度も提出する必要も減らせる。［　　］ そのため、効率性だけでなく、判断過程を確認できる仕組みや、人が見直す経路を用意することが重要である。","choices":["したがって、行政手続から人間の判断を完全に排除すべきである。","しかし、自動化された判断が誤った場合、その理由が分からなければ不利益を受けた人は是正を求めにくい。","つまり、デジタル化すれば行政法は不要になる。","一方、紙の手続は常にデジタル手続より迅速である。","このため、すべての情報は無条件に公開されなければならない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"前半の効率性に対し、後半の説明可能性・人による見直しにつながる逆接が自然。","source":"OpenAI作成・オリジナル文章","difficulty":"","category":""},{"id":"MOCK1-60","mock":"mock1","no":60,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"文章理解・文の並べ替え","stem":"次のア～エの文を論理的な文章になるように並べたものとして最も適切なものはどれか。\nア　そこで、情報の信頼性を判断する際には、発信者だけでなく根拠となる一次資料を確認する姿勢が重要になる。\nイ　もっとも、情報量が増えたことは、正確な情報だけが増えたことを意味しない。\nウ　インターネットの普及によって、個人が短時間で大量の情報へアクセスできるようになった。\nエ　誤った情報も、正しい情報と同じ速度で広がることがあるからである。","choices":["ア→イ→ウ→エ","イ→エ→ウ→ア","ウ→イ→エ→ア","ウ→エ→イ→ア","エ→ウ→ア→イ"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"ウで状況提示→イで逆接→エで理由→アで結論、が最も自然。","source":"OpenAI作成・オリジナル文章","difficulty":"","category":""}],"mock2":[{"id":"MOCK2-01","mock":"mock2","no":1,"format":"5肢択一","section":"法令等","subject":"基礎法学","field":"強行規定・任意規定","stem":"強行規定と任意規定に関する次の記述のうち、妥当なものはどれか。","choices":["強行規定は、当事者の合意によっていつでも適用を排除できる。","任意規定に反する当事者間の特約は常に無効である。","強行規定に反する法律行為は、法の趣旨に応じて効力を否定され得る。","強行規定と任意規定の区別は行政法にのみ存在する。","任意規定は裁判所が適用することのできない規定をいう。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"強行規定は当事者の意思で排除できない規律。任意規定は当事者の合意が優先し得る。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-02","mock":"mock2","no":2,"format":"5肢択一","section":"法令等","subject":"基礎法学","field":"公法・私法","stem":"公法と私法に関する次の記述のうち、妥当なものはどれか。","choices":["民法は公法の代表例である。","行政法は私人間の契約だけを規律する私法である。","公法・私法の区別は、法関係の性質や規律対象を理解するための基本的分類の一つである。","会社法は憲法と同じく典型的な公法である。","行政主体が当事者となる契約には私法規定が適用される余地は一切ない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"行政主体が関わっても私法規定が適用される領域はあり、公法・私法の境界は機械的ではない。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-03","mock":"mock2","no":3,"format":"5肢択一","section":"法令等","subject":"憲法","field":"信教の自由・政教分離","stem":"信教の自由と政教分離に関する次の記述のうち、妥当なものはどれか。","choices":["国は特定宗教への信仰を国民に義務付けることができる。","宗教団体は国から特権を受けても憲法上問題にならない。","何人も宗教上の行為、祝典、儀式または行事への参加を強制されない。","国およびその機関は宗教教育を自由に行うことができる。","信教の自由は外国人には一切保障されない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"憲法20条は信教の自由、宗教行為への参加強制禁止、国等の宗教活動禁止を定める。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK2-04","mock":"mock2","no":4,"format":"5肢択一","section":"法令等","subject":"憲法","field":"学問の自由・大学の自治","stem":"学問の自由に関する次の記述のうち、妥当なものはどれか。","choices":["憲法は学問の自由について明文規定を置いていない。","大学の自治は学問の自由と無関係である。","学問の自由には研究・研究発表・教授の自由が含まれると解されている。","大学教員の教授内容は国が常に個別に指示できる。","学問の自由は自然科学だけに認められる。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"憲法23条。大学の自治は学問の自由を制度的に保障する観点から問題となる。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK2-05","mock":"mock2","no":5,"format":"5肢択一","section":"法令等","subject":"憲法","field":"財産権・損失補償","stem":"憲法29条に関する次の記述のうち、妥当なものはどれか。","choices":["財産権の内容は行政機関の通達だけで自由に定められる。","私有財産は、正当な補償の下に公共のために用いることができる。","財産権は公共の福祉による制約を一切受けない。","財産権の内容は法律によって定めることができない。","損失補償は違法な行政活動に対する制裁である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"憲法29条3項は私有財産を正当な補償の下に公共のため用い得るとする。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK2-06","mock":"mock2","no":6,"format":"5肢択一","section":"法令等","subject":"憲法","field":"国会議員の不逮捕特権","stem":"国会議員の不逮捕特権について、妥当なものはどれか。","choices":["会期中であっても、法律の定める場合を除き、国会議員は逮捕されない。","国会議員は会期外も一切逮捕されない。","会期前に逮捕された議員を所属議院が釈放させる制度はない。","不逮捕特権は地方議会議員にも憲法上同じ形で保障される。","不逮捕特権は国会議員の私生活上のあらゆる行為を免責する制度である。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"憲法50条。会期中の不逮捕と、会期前逮捕議員の議院要求による釈放を定める。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK2-07","mock":"mock2","no":7,"format":"5肢択一","section":"法令等","subject":"憲法","field":"最高裁判所裁判官の国民審査","stem":"最高裁判所裁判官の国民審査について、妥当なものはどれか。","choices":["最高裁判所裁判官は国民審査の対象にならない。","任命後初めて行われる衆議院議員総選挙の際に国民審査を受ける。","国民審査は参議院議員通常選挙の際にだけ行われる。","国民審査で罷免可否を決めるのは国会である。","一度国民審査を受ければその後は二度と国民審査を受けない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"憲法79条。任命後初の衆院総選挙時、その後10年を経た後最初の衆院総選挙時に再審査。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK2-08","mock":"mock2","no":8,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政行為の附款","stem":"行政行為の附款について、妥当なものはどれか。","choices":["附款の負担に違反すると主たる行政行為は当然に遡及無効となる。","行政行為に付された開始日・終了日は常に条件である。","負担は、行政行為の相手方に作為または不作為義務を課す附款である。","撤回権留保がなければ処分を撤回できる余地は一切ない。","法令上裁量が認められる処分にも附款を付す余地はない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"負担は独立した義務を課す附款。違反しても主たる処分が当然無効になるわけではない。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-09","mock":"mock2","no":9,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政立法・委任命令","stem":"行政立法に関する次の記述のうち、妥当なものはどれか。","choices":["省令は法律の委任がなくても自由に刑罰を定められる。","法律の委任範囲を逸脱した命令も、取消判決があるまで必ず有効である。","法律の委任に基づく命令は、委任の範囲内で定めなければならない。","通達は国民を直接拘束する法規命令である。","訓令は国会が制定する法形式である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"委任命令は授権法の範囲を超えられない。通達・訓令は行政内部規律が中心。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-10","mock":"mock2","no":10,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政調査","stem":"行政調査に関する次の記述のうち、妥当なものはどれか。","choices":["強制的な行政調査に法律上の根拠は一切不要である。","税務調査で得た資料は、どのような事情でも刑事手続に利用できない。","行政調査拒否に刑罰を科す場合、刑罰について法律上の根拠が必要となる。","行政手続法は行政調査一般について事前通知事項を網羅的に規定している。","職務質問に付随する所持品検査は常に強制的に実施できる。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"強制調査や拒否への制裁には法律の根拠が問題となる。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-11","mock":"mock2","no":11,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"申請の取扱い","stem":"行政手続法上の申請について、妥当なものはどれか。","choices":["形式上必要な要件を満たす申請が到達しても、行政庁は受理という別行為をするまで審査を開始しなくてよい。","形式要件に適合しない申請には、補正を求めるか申請を拒否する。","申請拒否前には必ず聴聞を行う。","標準処理期間を超えると申請は自動的に認容されたものとみなされる。","申請者から求められても審査の進行状況を示す努力義務はない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行政手続法7条。形式要件不適合なら補正要求または拒否。適合申請は遅滞なく審査開始。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-12","mock":"mock2","no":12,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"不利益処分・理由提示","stem":"不利益処分の理由提示について、妥当なものはどれか。","choices":["不利益処分では理由を示す必要がない。","理由提示は相手方から請求された場合だけ行う。","差し迫った必要があるときは同時提示をしないことが許される場合があるが、後に理由を示す必要がある。","理由として根拠条文だけを示せば常に足りる。","理由提示の瑕疵は処分の違法性と無関係である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"行政手続法14条。原則同時提示、差し迫った必要の例外と事後提示。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-13","mock":"mock2","no":13,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"意見公募手続","stem":"意見公募手続について、妥当なものはどれか。","choices":["命令等の案を公示して意見を求める期間は、原則として30日以上とされる。","提出された意見は必ずすべて採用しなければならない。","審査基準は意見公募手続の対象となる命令等に含まれない。","行政指導指針は命令等に含まれない。","命令を制定しないことにした場合は、その旨を公示する必要はない。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"原則30日以上。提出意見に拘束されないが、考慮結果・理由等の公示が問題となる。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-14","mock":"mock2","no":14,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"教示","stem":"処分についての教示に関する次の記述のうち、妥当なものはどれか。","choices":["審査請求できる処分でも、処分庁に教示義務はない。","書面でする処分では、審査請求先や期間等を原則として書面で教示する。","教示を誤った場合、その処分は当然無効となる。","利害関係人が書面による教示を求めても口頭で足りる。","執行停止申立ての方法まで必ず教示しなければならない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行政不服審査法82条。審査請求可能な処分では審査庁・期間等を教示する。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-15","mock":"mock2","no":15,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"再調査の請求","stem":"再調査の請求について、妥当なものはどれか。","choices":["法律に特別の定めがなくても、処分庁への再調査請求ができる。","再調査請求が可能な場合でも、原則として直ちに審査請求を選ぶことができる。","不作為について再調査請求できる。","再調査請求では口頭意見陳述の制度がない。","再調査請求をした後は、どのような場合も審査請求へ移行できない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"再調査は法律に特別の定めがある場合。不作為は対象外で、審査請求を直接選ぶことも可能。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-16","mock":"mock2","no":16,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"裁決・事情裁決","stem":"審査請求の裁決について、妥当なものはどれか。","choices":["理由がない審査請求は却下裁決となる。","不適法な審査請求は棄却裁決となる。","認容裁決で審査請求人に不利益な変更をすることができる。","処分取消しが公共の福祉に重大な影響を及ぼす場合、事情を考慮して請求を棄却しつつ処分が違法・不当である旨を宣言する制度がある。","裁決には理由を示す必要がない。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"不適法=却下、理由なし=棄却。不利益変更禁止。事情裁決の制度がある。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-17","mock":"mock2","no":17,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"無効等確認訴訟","stem":"無効等確認訴訟について、妥当なものはどれか。","choices":["取消訴訟と同じ6か月・1年の出訴期間が一般に適用される。","処分の無効確認は法律上の利益を問わず誰でも求められる。","審査請求前置の定めがある処分についても、無効等確認訴訟には同じ前置が当然に必要である。","現在の法律関係に関する訴えによって目的を達成できないことなどが原告適格上問題となる。","無効等確認訴訟には執行停止の規定が一切準用されない。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"無効等確認訴訟には法律上の利益と補充性が問題となる。取消訴訟の一般的出訴期間は準用されない。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-18","mock":"mock2","no":18,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"義務付け訴訟","stem":"義務付け訴訟について、妥当なものはどれか。","choices":["申請型義務付け訴訟は、拒否処分取消訴訟等と併合できない。","裁判所は行政庁に代わって自ら許可処分をする。","申請型義務付け訴訟では、拒否処分等の取消し・無効確認等との併合が問題となる。","義務付け訴訟には仮の救済制度がない。","非申請型義務付け訴訟では重大な損害のおそれは問題とならない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"申請型は拒否処分取消し等との併合が基本。仮の義務付けも設けられている。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-19","mock":"mock2","no":19,"format":"5肢択一","section":"法令等","subject":"行政事件訴訟法","field":"取消判決の効力","stem":"取消判決の効力について、妥当なものはどれか。","choices":["取消判決は当事者にしか効力を及ぼさず第三者には一切効力がない。","取消判決の拘束力は関係行政庁に及ぶ。","申請拒否処分が取り消されれば行政庁は必ず申請どおりの処分をしなければならない。","取消判決の拘束力は他の抗告訴訟に一切準用されない。","処分取消判決が確定しても処分は法律上存続する。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"関係行政庁は取消判決の趣旨に従う。申請拒否取消しは再審査を義務付けるが、常に認容を義務付けるわけではない。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-20","mock":"mock2","no":20,"format":"5肢択一","section":"法令等","subject":"国家賠償法","field":"3条・費用負担者","stem":"国家賠償法3条について、妥当なものはどれか。","choices":["公務員の任命監督者と給与負担者が異なっても給与負担者は責任を負うことがない。","営造物管理者と費用負担者が異なる場合、費用負担者が賠償責任を負う場合がある。","国家賠償法3条は国と地方公共団体間の求償を禁止する。","国家賠償法3条は外国人にだけ適用される。","国家賠償法3条は公務員個人の刑事責任を定める。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"管理・任命監督主体と費用負担主体が異なる場合の対外責任・内部求償を調整する。","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-21","mock":"mock2","no":21,"format":"5肢択一","section":"法令等","subject":"国家賠償法","field":"営造物・第三者被害","stem":"国家賠償法2条の営造物責任について、妥当なものはどれか。","choices":["営造物の利用者以外の第三者に生じる危害は2条の対象にならない。","営造物の設置管理瑕疵の判断では通常有すべき安全性が問題となる。","管理者の故意がなければ2条責任は成立しない。","予算不足があれば常に免責される。","道路は公の営造物に含まれない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"利用者だけでなく第三者への危害も、安全性欠如として問題となり得る。2条は過失を要件としない。","source":"https://laws.e-gov.go.jp/law/322AC0000000125?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-22","mock":"mock2","no":22,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"条例制定改廃の直接請求","stem":"条例の制定・改廃の直接請求について、妥当なものはどれか。","choices":["選挙権を有する者の総数の50分の1以上の連署をもって、長に請求する制度がある。","請求先は裁判所である。","地方税の賦課徴収に関する条例も必ず直接請求の対象となる。","条例案は住民投票だけで成立し議会審議を要しない。","外国人住民に憲法上当然の地方選挙権が認められることを前提とする制度である。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"地方自治法74条。税・分担金・使用料・手数料等には対象除外がある。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-23","mock":"mock2","no":23,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"不信任・議会解散","stem":"地方公共団体の長に対する不信任議決について、妥当なものはどれか。","choices":["議員の過半数が出席し出席議員の過半数で可決できる。","議員数の3分の2以上が出席し、その4分の3以上の同意が必要である。","不信任議決後、長は議会を解散できない。","不信任議決後の議会解散には都道府県知事の承認が必要である。","不信任議決は住民監査請求を経なければできない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"地方自治法178条。長は不信任通知を受けた日から10日以内に議会を解散できる。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-24","mock":"mock2","no":24,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"公の施設・指定管理者","stem":"指定管理者制度について、妥当なものはどれか。","choices":["指定管理者になれるのは地方公共団体の職員だけである。","指定管理者の指定は長の内部決裁だけで足りる。","条例の定めるところにより、法人その他の団体を指定管理者として公の施設の管理を行わせることができる。","指定管理者には利用料金を収受させることは一切できない。","指定管理者制度は国の行政機関だけに適用される。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"公の施設の管理を法人その他の団体に行わせる制度。指定には議会議決等が必要。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-25","mock":"mock2","no":25,"format":"5肢択一","section":"法令等","subject":"地方自治法","field":"契約方式","stem":"普通地方公共団体の契約について、妥当なものはどれか。","choices":["契約はすべて随意契約によらなければならない。","一般競争入札のほか、政令で定める場合に指名競争入札・随意契約・せり売り等を用いることができる。","契約方式は地方公共団体が法律に関係なく自由に創設できる。","指名競争入札は法律上禁止されている。","契約に地方自治法上の規律は存在しない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"地方自治法234条。一般競争を基本とし、政令所定の場合に他方式を利用。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-26","mock":"mock2","no":26,"format":"5肢択一","section":"法令等","subject":"行政法","field":"公文書管理法","stem":"公文書管理法について、妥当なものはどれか。","choices":["行政文書とは職員個人の私的メモだけをいう。","行政機関の長は行政文書管理規則を設ける必要がない。","行政文書は職務上作成・取得され、組織的に用いるものとして行政機関が保有する文書等を中心に定義される。","保存期間を設定する制度は存在しない。","行政文書管理状況を国民に公表する制度はない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"公文書管理法は作成・整理・保存・移管・廃棄等のルールを定める。","source":"https://laws.e-gov.go.jp/law/421AC0000000066?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-27","mock":"mock2","no":27,"format":"5肢択一","section":"法令等","subject":"民法","field":"条件・期限","stem":"条件に関する次の記述のうち、妥当なものはどれか。","choices":["停止条件付法律行為は、条件が成就しても効力を生じない。","解除条件付法律行為は、条件成就によって効力を失うのが原則である。","条件成就により不利益を受ける当事者が故意に条件成就を妨げても相手方は何も主張できない。","債務者の意思だけに係る停止条件は常に有効である。","条件と期限は法律上まったく同じ概念である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"停止条件は成就で効力発生、解除条件は成就で効力消滅が原則。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-28","mock":"mock2","no":28,"format":"5肢択一","section":"法令等","subject":"民法","field":"消滅時効","stem":"一般の債権の消滅時効について、妥当なものはどれか。","choices":["権利を行使できることを知った時から3年で一律に消滅する。","権利を行使できることを知った時から5年、または権利を行使できる時から10年という基本構造である。","裁判所は当事者の援用がなくても必ず時効を適用する。","一般債権の客観的期間は20年である。","債権には消滅時効がない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"現行民法166条。主観5年・客観10年を基本に整理。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-29","mock":"mock2","no":29,"format":"5肢択一","section":"法令等","subject":"民法","field":"根抵当権","stem":"根抵当権について、妥当なものはどれか。","choices":["元本確定前に被担保債権を譲り受けた者は、その債権について当然に根抵当権を行使できる。","元本確定前の被担保債権範囲変更には、常に後順位抵当権者の承諾が必要である。","元本確定前に債権を譲り受けただけでは、その債権について根抵当権を行使できない。","元本確定後は極度額減額請求制度は存在しない。","根抵当権には極度額という概念がない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"根抵当は確定前の債権譲渡に普通抵当と異なるルールがある。極度額が中心概念。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-30","mock":"mock2","no":30,"format":"5肢択一","section":"法令等","subject":"民法","field":"留置権","stem":"留置権について、妥当なものはどれか。","choices":["占有が不法行為によって始まった場合でも当然に留置権が成立する。","留置権は債権と物の牽連性を必要としない。","占有が不法行為によって始まった場合、留置権の成立は認められない。","留置権者は目的物を自由に処分できる。","留置権は不動産には成立しない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"民法295条2項。不法行為によって占有を始めた場合は留置権を認めない。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-31","mock":"mock2","no":31,"format":"5肢択一","section":"法令等","subject":"民法","field":"保証","stem":"保証契約について、妥当なものはどれか。","choices":["保証契約は口頭だけでも常に有効である。","保証契約は書面または一定の電磁的記録によらなければ効力を生じない。","主債務が無効でも保証債務だけは必ず有効である。","保証人は主債務者の有する抗弁を一切主張できない。","保証債務は主債務より常に重い内容でなければならない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"保証契約は書面性が要求され、電磁的記録にも特則がある。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-32","mock":"mock2","no":32,"format":"5肢択一","section":"法令等","subject":"民法","field":"解除・軽微な不履行","stem":"契約解除について、妥当なものはどれか。","choices":["債務不履行が軽微でも必ず解除できる。","債務者の責めに帰することができない事由がある限り、債権者はどのような場合も解除できない。","不履行が契約および取引上の社会通念に照らして軽微であるときは、原則として解除できない。","債務者が全部履行を明確に拒絶していても必ず催告が必要である。","解除権は債権者だけでなく無関係な第三者も行使できる。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"現行民法は軽微な不履行による解除を制限する。無催告解除事由にも注意。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-33","mock":"mock2","no":33,"format":"5肢択一","section":"法令等","subject":"民法","field":"不当利得","stem":"不当利得について、妥当なものはどれか。","choices":["善意の受益者は、受けた利益が現存しなくても常に全額返還する。","悪意の受益者は、受けた利益に利息を付して返還し、損害があれば賠償責任を負う場合がある。","不当利得返還請求には法律上の原因の不存在は関係しない。","不法原因給付でも給付者は常に返還請求できる。","受益と損失との間に関係は不要である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"悪意受益者には利息・損害賠償の加重責任がある。善意受益者は現存利益が原則。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-34","mock":"mock2","no":34,"format":"5肢択一","section":"法令等","subject":"民法","field":"法定相続分","stem":"配偶者と子が共同相続人となる場合の法定相続分について、妥当なものはどれか。","choices":["配偶者が4分の3、子全体が4分の1である。","配偶者と子全体がそれぞれ2分の1である。","配偶者が3分の1、子全体が3分の2である。","配偶者には法定相続分がない。","子が複数いても各子が2分の1ずつ取得する。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"配偶者と子が相続人なら、配偶者1/2・子全体1/2。子が複数ならその中で等分が原則。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-35","mock":"mock2","no":35,"format":"5肢択一","section":"法令等","subject":"民法","field":"2026財産分与改正","stem":"2026年4月1日以後に離婚した夫婦の財産分与について、妥当なものはどれか。","choices":["家庭裁判所への申立期間は離婚後1年である。","離婚後2年である。","離婚後3年である。","離婚後5年である。","期間制限はない。"],"wordbank":"","points":4,"answers":["4"],"model":"","explanation":"2026年4月1日以後の離婚は5年。施行日前の離婚は従前の2年。","source":"https://www.moj.go.jp/MINJI/parents_012.html","difficulty":"","category":""},{"id":"MOCK2-36","mock":"mock2","no":36,"format":"5肢択一","section":"法令等","subject":"商法","field":"支配人","stem":"商法上の支配人について、妥当なものはどれか。","choices":["支配人は営業に関する裁判上の行為を一切できない。","支配人の代理権に加えた内部的制限は、善意の第三者に常に対抗できる。","支配人は営業に関する一切の裁判上・裁判外の行為をする権限を有する。","支配人は自然人でなく法人でなければならない。","支配人制度は会社には利用できない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"支配人は包括的営業代理権を有し、その制限は善意第三者に対抗できない。","source":"https://laws.e-gov.go.jp/law/132AC0000000048?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-37","mock":"mock2","no":37,"format":"5肢択一","section":"法令等","subject":"会社法","field":"取締役会設置会社","stem":"取締役会設置会社について、妥当なものはどれか。","choices":["取締役は1人いれば足りる。","取締役会設置会社には取締役が3人以上必要である。","取締役会設置会社に代表取締役を置くことはできない。","公開会社は取締役会を置くことができない。","取締役会は株主だけで構成される。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"会社法331条5項。取締役会設置会社では取締役3人以上。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-38","mock":"mock2","no":38,"format":"5肢択一","section":"法令等","subject":"会社法","field":"取締役の任期","stem":"取締役の任期について、妥当なものはどれか。","choices":["株式会社の取締役任期は常に1年である。","公開会社でない株式会社では、定款により取締役任期を選任後10年以内まで伸長できる場合がある。","取締役は終身任期である。","任期は定款でも変更できない。","取締役任期は会社法に規定されていない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"非公開会社では定款により取締役等の任期を最長10年まで伸長できる。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-39","mock":"mock2","no":39,"format":"5肢択一","section":"法令等","subject":"会社法","field":"剰余金配当","stem":"株式会社の剰余金配当について、妥当なものはどれか。","choices":["分配可能額を超えて自由に配当できる。","会社債権者保護のため、剰余金配当には分配可能額による制限がある。","剰余金配当は会社法の規律を受けない。","株主以外の者にだけ配当することが義務である。","株式会社は剰余金配当を一切できない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"会社法は分配可能額を設け、違法配当について責任規定等を置く。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-40","mock":"mock2","no":40,"format":"5肢択一","section":"法令等","subject":"会社法","field":"合同会社","stem":"合同会社について、妥当なものはどれか。","choices":["合同会社の社員は全員無限責任社員である。","合同会社では社員全員が有限責任社員である。","合同会社には定款を作成する必要がない。","合同会社は法人ではない。","合同会社は社員1人では設立できない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"合同会社は持分会社の一つで、社員は有限責任。1人会社も可能。","source":"https://laws.e-gov.go.jp/law/417AC0000000086?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-41","mock":"mock2","no":41,"format":"多肢選択","section":"法令等","subject":"憲法","field":"財産権","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n憲法29条は、［ア］はこれを侵してはならないとし、その内容は［イ］に適合するように［ウ］で定めるとしている。また、私有財産は、正当な［エ］の下に公共のために用いることができる。","choices":[],"wordbank":"1.財産権　2.公共の福祉　3.法律　4.補償　5.政令　6.契約　7.自由　8.条例　9.公益　10.損害賠償　11.国会　12.内閣　13.命令　14.財産　15.権利能力　16.許可　17.収用　18.社会秩序　19.判決　20.同意","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=財産権、イ=公共の福祉、ウ=法律、エ=補償。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"","category":""},{"id":"MOCK2-42","mock":"mock2","no":42,"format":"多肢選択","section":"法令等","subject":"行政法","field":"行政不服審査法","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n処分について、法律に特別の定めがある場合には処分庁に［ア］をすることができる。一方、通常の審査請求では、原則として［イ］が審理を行い、審査庁に意見書を提出する。審査庁の終局判断を［ウ］といい、処分時の教示に誤りがあった場合の救済を含め、［エ］の制度が行政救済の入口となる。","choices":[],"wordbank":"1.再調査の請求　2.審理員　3.裁決　4.教示　5.再審査請求　6.執行停止　7.参加人　8.総代　9.申請　10.届出　11.聴聞　12.弁明　13.取消訴訟　14.義務付け　15.判決　16.決定　17.諮問　18.公示　19.審査基準　20.行政指導","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=再調査の請求、イ=審理員、ウ=裁決、エ=教示。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-43","mock":"mock2","no":43,"format":"多肢選択","section":"法令等","subject":"行政法","field":"地方自治法","stem":"次の文章の空欄ア～エに当てはまる語句を、語群から選びなさい。\n普通地方公共団体は、法令に違反しない限りその事務に関し［ア］を制定できる。長は法令に違反しない限り権限事務に関し［イ］を制定できる。議会が軽易な事項として指定したものを長が処理することを［ウ］といい、長が議決に異議がある場合などには［エ］の制度が問題となる。","choices":[],"wordbank":"1.条例　2.規則　3.専決処分　4.再議　5.審査請求　6.住民訴訟　7.告示　8.通達　9.法定受託事務　10.自治事務　11.監査　12.不信任　13.直接請求　14.公の施設　15.指定管理者　16.契約　17.地方債　18.予算　19.決算　20.財産","points":8,"answers":["1","2","3","4"],"model":"","explanation":"ア=条例、イ=規則、ウ=専決処分、エ=再議。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-44","mock":"mock2","no":44,"format":"記述式","section":"法令等","subject":"行政法","field":"取消訴訟・執行停止","stem":"Xは行政庁から営業停止処分を受け、取消訴訟を提起した。処分の執行により重大な損害が生ずるおそれがあり、緊急に執行を止める必要がある。Xが申し立てるべき制度と中心的要件を40字程度で記述しなさい。","choices":[],"wordbank":"","points":20,"answers":[],"model":"重大な損害を避けるため緊急の必要があるとして、処分の執行停止を申し立てる。","explanation":"取消訴訟を本案として執行停止を申し立てる。損害要件は「重大な損害」。","source":"https://laws.e-gov.go.jp/law/337AC0000000139?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-45","mock":"mock2","no":45,"format":"記述式","section":"法令等","subject":"民法","field":"2026財産分与","stem":"AとBは2026年6月に離婚したが、財産分与の協議が整わない。Aが家庭裁判所による財産分与を求める場合、いつまでに、どのような申立てをすべきか。40字程度で記述しなさい。","choices":[],"wordbank":"","points":20,"answers":[],"model":"離婚から5年以内に、家庭裁判所へ財産分与の調停または審判を申し立てる。","explanation":"2026年4月1日以後の離婚では財産分与の家庭裁判所への申立期間は5年。","source":"https://www.moj.go.jp/MINJI/parents_012.html","difficulty":"","category":""},{"id":"MOCK2-46","mock":"mock2","no":46,"format":"記述式","section":"法令等","subject":"民法","field":"相続・第三者対抗要件","stem":"被相続人Aは遺言により相続人Bに不動産を法定相続分を超えて承継させた。その後、第三者Cが同不動産について権利を取得した。Bが法定相続分を超える取得をCに対抗するために必要なことを40字程度で記述しなさい。","choices":[],"wordbank":"","points":20,"answers":[],"model":"法定相続分を超える取得部分について、登記を備えなければ第三者に対抗できない。","explanation":"民法899条の2。相続による権利承継も法定相続分を超える部分は対抗要件が必要。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-47","mock":"mock2","no":47,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"AI法","stem":"2025年に全面施行されたAI法について、妥当なものはどれか。","choices":["AIの研究開発・活用を原則禁止する法律である。","内閣に人工知能戦略本部を置き、AI基本計画の策定等を進める枠組みを設けている。","AIを利用する全ての個人に事前免許を義務付ける。","刑法を廃止してAI専用刑法に一本化する。","地方公共団体だけを対象とする法律である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"AI法はイノベーション促進とリスク対応を両立させ、AI戦略本部・AI基本計画等を定める。","source":"https://www8.cao.go.jp/cstp/ai/ai_act/ai_act.html","difficulty":"","category":""},{"id":"MOCK2-48","mock":"mock2","no":48,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"防災・災害対策基本法","stem":"災害対策基本法上の防災体制について、妥当なものはどれか。","choices":["中央防災会議は民間企業だけで構成される任意団体である。","中央防災会議は防災基本計画を作成し、その実施を推進する役割を担う。","防災基本計画は各市町村長が単独で作成する国の計画である。","災害対策基本法は地方公共団体に防災上の責務を課していない。","指定公共機関という制度は存在しない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"中央防災会議は国の防災政策の基本となる防災基本計画を作成する。","source":"https://laws.e-gov.go.jp/law/336AC0000000223?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-49","mock":"mock2","no":49,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"日本銀行","stem":"日本銀行の目的に関する次の記述のうち、妥当なものはどれか。","choices":["日本銀行は国会の一部である。","日本銀行の通貨・金融調節は、物価の安定を図ることを通じて国民経済の健全な発展に資することを理念とする。","日本銀行は地方税の税率を決定する。","日本銀行は民間企業の株主総会を監督することを主目的とする。","日本銀行には銀行間の資金決済に関する役割はない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"日本銀行法は物価安定と金融システム・決済の安定に関する役割を定める。","source":"https://laws.e-gov.go.jp/law/409AC0000000089?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-50","mock":"mock2","no":50,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"GDP・名目実質","stem":"GDPに関する次の記述のうち、妥当なものはどれか。","choices":["名目GDPは物価変動の影響を除いて計算される。","実質GDPは、物価変動の影響を調整して経済活動の量的変化をみるために用いられる。","GDPは国内で生産された付加価値を考慮しない。","GDPと人口は常に同じ割合で増減する。","GDPには市場で取引される財・サービスは一切含まれない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"実質GDPは価格変動の影響を除いて量的な成長を把握する指標。","source":"https://www.esri.cao.go.jp/jp/sna/menu.html","difficulty":"","category":""},{"id":"MOCK2-51","mock":"mock2","no":51,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"国際連合・安全保障理事会","stem":"国連安全保障理事会について、妥当なものはどれか。","choices":["常任理事国は日本、ドイツ、インド、ブラジル、カナダである。","常任理事国は中国、フランス、ロシア、英国、米国である。","安全保障理事会に非常任理事国は存在しない。","安全保障理事会は国際連合とは別組織である。","常任理事国に拒否権はない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"安全保障理事会の常任理事国は中国、フランス、ロシア、英国、米国の5か国。","source":"https://main.un.org/securitycouncil/en/content/current-members","difficulty":"","category":""},{"id":"MOCK2-52","mock":"mock2","no":52,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"デジタル庁","stem":"デジタル庁について、妥当なものはどれか。","choices":["デジタル庁は都道府県の共同組織である。","デジタル庁は2021年に発足し、国のデジタル社会形成の司令塔機能を担う。","デジタル庁は裁判所の一部である。","デジタル庁は紙の行政手続を法律上すべて禁止する。","デジタル庁は個人情報保護委員会を廃止して設置された。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"デジタル庁は2021年9月発足。デジタル社会形成の司令塔として国の情報システム等を推進する。","source":"https://laws.e-gov.go.jp/law/503AC0000000036?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-53","mock":"mock2","no":53,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"行政書士法・2026改正","stem":"2026年1月1日施行の行政書士法改正について、妥当なものはどれか。","choices":["行政書士の使命・職責に関する規定は削除された。","特定行政書士の不服申立て代理業務の対象は、行政書士が実際に作成した書類に係るものだけへさらに限定された。","行政書士でない者の業務制限規定について、報酬を得て業務を行うことに関する趣旨の明確化等が行われた。","行政書士法人制度は廃止された。","改正法は2027年1月1日施行である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"改正では使命・職責の明確化、特定行政書士の業務範囲拡大、業務制限規定の趣旨明確化、両罰規定整備等が行われた。","source":"https://www.shugiin.go.jp/Internet/itdb_gian.nsf/html/gian/honbun/youkou/g21705036.htm","difficulty":"","category":""},{"id":"MOCK2-54","mock":"mock2","no":54,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"マイナンバー制度","stem":"マイナンバー制度について、妥当なものはどれか。","choices":["個人番号は原則として12桁である。","個人番号は本人が好きな番号を選ぶ。","法人番号と個人番号は同じ桁数である。","個人番号は民間事業者がどのような目的でも自由に利用できる。","個人番号は住所変更のたびに必ず変更される。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"個人番号は原則12桁。利用範囲や提供には番号法上の制限がある。","source":"https://laws.e-gov.go.jp/law/425AC0000000027?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-55","mock":"mock2","no":55,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"電子署名・公開鍵暗号","stem":"公開鍵暗号方式に関する次の記述のうち、妥当なものはどれか。","choices":["公開鍵と秘密鍵はまったく同じ鍵を全員で共有する。","一般に、秘密鍵で作成した電子署名を対応する公開鍵で検証する仕組みを利用できる。","秘密鍵はインターネット上で広く公開するのが原則である。","公開鍵暗号では鍵という概念を用いない。","電子署名は改ざん検知と無関係である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"公開鍵と秘密鍵の対を利用し、署名の本人性・非改ざん性確認に活用される。","source":"https://laws.e-gov.go.jp/law/412AC0000000102?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-56","mock":"mock2","no":56,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"要配慮個人情報","stem":"個人情報保護法上の要配慮個人情報について、妥当なものはどれか。","choices":["氏名はすべて要配慮個人情報である。","住所は必ず要配慮個人情報である。","病歴や犯罪の経歴など、本人への不当な差別・偏見等を生じさせないよう特に配慮を要する情報が含まれる。","法人の売上高だけが要配慮個人情報である。","要配慮個人情報は個人情報保護法の対象外である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"要配慮個人情報には人種、信条、社会的身分、病歴、犯罪の経歴、被害事実等が含まれる。","source":"https://laws.e-gov.go.jp/law/415AC0000000057?occasion_date=20260401","difficulty":"","category":""},{"id":"MOCK2-57","mock":"mock2","no":57,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"情報セキュリティ・ランサムウェア","stem":"ランサムウェアについて、妥当なものはどれか。","choices":["データを暗号化するなどして利用不能にし、復旧と引換えに金銭等を要求するマルウェアを指す。","OSの正規更新機能だけを指す。","多要素認証と同じ意味である。","紙文書をスキャンする技術である。","ネットワークを高速化するだけのソフトウェアである。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"ランサムウェアはデータ暗号化・端末ロック等を行い身代金を要求する攻撃。","source":"https://security-portal.nisc.go.jp/guidance/handbook.html","difficulty":"","category":""},{"id":"MOCK2-58","mock":"mock2","no":58,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"文章理解・要旨","stem":"次の文章の要旨として最も適切なものはどれか。\n専門知識を持つ人ほど、説明を短くすることが難しい場合がある。背景知識を共有しているつもりで、多くの前提を省略してしまうからだ。分かりやすい説明とは、情報を減らすことではなく、相手が結論までたどれるよう必要な前提を選び、順序を整えることである。","choices":["専門知識が多いほど説明は必ず分かりやすくなる。","分かりやすい説明には、情報をすべて削除することが必要である。","説明では相手の理解に必要な前提を選び、論理的な順序で示すことが重要である。","背景知識を持たない相手には説明しても無意味である。","短い説明は常に長い説明より優れている。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"文章は「短さ」ではなく、必要な前提の選択と順序づけを重視している。","source":"OpenAI作成・オリジナル文章","difficulty":"","category":""},{"id":"MOCK2-59","mock":"mock2","no":59,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"文章理解・空欄補充","stem":"次の文章の空欄に入る文として最も適切なものはどれか。\n統計には、対象を正確に測定する力がある一方で、数字だけでは捉えにくい事情もある。平均値が同じ二つの集団でも、ばらつきや分布は大きく異なることがある。［　　］ したがって、単一の指標だけで結論を出すのではなく、複数の指標や背景情報を確認する必要がある。","choices":["そのため、平均値だけを見ればすべての特徴を理解できる。","つまり、数字は一切利用すべきではない。","このように、同じ代表値でも集団の実態が異なる場合がある。","したがって、統計では母集団を考える必要がない。","平均値は必ず中央値と一致する。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"直前の具体例を一般化し、後続の結論につなぐ文が自然。","source":"OpenAI作成・オリジナル文章","difficulty":"","category":""},{"id":"MOCK2-60","mock":"mock2","no":60,"format":"5肢択一","section":"基礎知識","subject":"基礎知識","field":"文章理解・文の並べ替え","stem":"次のア～エの文を論理的な文章になるように並べたものとして最も適切なものはどれか。\nア　しかし、失敗から得られる情報は、成功から得られる情報とは異なる。\nイ　そこで、試行の結果だけでなく、なぜその結果になったかを記録することが重要になる。\nウ　新しい方法を試すとき、人は成功した事例に注目しがちである。\nエ　何が機能しなかったかを知ることで、次の試行で避けるべき条件を絞り込めるからである。","choices":["ア→イ→ウ→エ","ウ→ア→エ→イ","ウ→エ→ア→イ","イ→ウ→ア→エ","エ→ア→ウ→イ"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"ウで問題提起、アで逆接、エで理由、イで結論。","source":"OpenAI作成・オリジナル文章","difficulty":"","category":""}],"mock3":[{"id":"MOCK3-01","mock":"mock3","no":1,"format":"5肢択一","section":"法令等","subject":"基礎法学","field":"一般法・特別法","stem":"一般法と特別法の関係に関する次の記述のうち、妥当なものはどれか。","choices":["一般法と特別法が同一事項について異なる規律を置く場合、常に一般法が優先する。","特別法は特定の人・物・事柄について一般法より特別の規律を置く法であり、その範囲では特別法が優先して適用されるのが原則である。","特別法は必ず一般法より後に制定された法律だけをいう。","一般法と特別法の区別は民法にしか存在しない。","特別法が存在すれば一般法は全面的に失効する。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"同一事項に一般法と特別法がある場合、特別法がその特別な範囲で優先するのが原則。","source":"https://laws.e-gov.go.jp/law/129AC0000000089?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-02","mock":"mock3","no":2,"format":"5肢択一","section":"法令等","subject":"基礎法学","field":"公布・施行・経過措置","stem":"法令の公布・施行等に関する次の記述のうち、妥当なものはどれか。","choices":["法律は国会で可決された瞬間に必ず施行される。","法律の公布と施行は同じ概念であり、施行日を別に定めることはできない。","法律の施行日は附則等で定められることがあり、法改正の際には経過措置が置かれることもある。","新法はどのような場合でも施行前の事実関係へ必ず遡及適用される。","法律の公布は裁判所が行う。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"公布と施行は別概念。施行日・経過措置により旧法と新法の適用関係が調整される。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"標準","category":"薄出"},{"id":"MOCK3-03","mock":"mock3","no":3,"format":"5肢択一","section":"法令等","subject":"憲法","field":"居住移転・職業選択の自由","stem":"憲法22条に関する次の記述のうち、妥当なものはどれか。","choices":["何人も、公共の福祉に反しない限り、居住・移転および職業選択の自由を有する。","職業選択の自由は憲法上保障されていない。","外国移住の自由は憲法上まったく保障されない。","居住移転の自由は精神的自由権だけに分類され、経済的自由の側面はない。","職業規制は目的・態様を問わずすべて違憲となる。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"憲法22条。職業の自由には公共の福祉による規制があり、規制目的・態様に応じて審査される。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"標準","category":"薄出"},{"id":"MOCK3-04","mock":"mock3","no":4,"format":"5肢択一","section":"法令等","subject":"憲法","field":"教育を受ける権利","stem":"憲法26条に関する次の記述のうち、妥当なものはどれか。","choices":["教育を受ける権利について憲法は何も定めていない。","すべて国民は、法律の定めるところにより、その能力に応じてひとしく教育を受ける権利を有する。","義務教育は有償とすることが憲法上義務付けられている。","子に普通教育を受けさせる義務を負うのは国だけで、保護する子を持つ国民ではない。","義務教育は大学教育を意味する。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"憲法26条。保護する子に普通教育を受けさせる義務、義務教育無償を定める。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"標準","category":"薄出"},{"id":"MOCK3-05","mock":"mock3","no":5,"format":"5肢択一","section":"法令等","subject":"憲法","field":"適正手続・令状主義","stem":"刑事手続に関する次の記述のうち、妥当なものはどれか。","choices":["憲法31条は法律の定める手続によらなければ生命・自由を奪い刑罰を科されない旨を定める。","住居への捜索はどのような場合も令状を要しない。","令状は警察官が自ら発する。","憲法35条は住居・書類・所持品への侵入・捜索・押収について保障を置いていない。","適正手続の保障は刑罰法規と無関係である。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"憲法31条の適正手続、35条の令状主義が基本。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"標準","category":"薄出"},{"id":"MOCK3-06","mock":"mock3","no":6,"format":"5肢択一","section":"法令等","subject":"憲法","field":"財政","stem":"国の財政に関する次の記述のうち、妥当なものはどれか。","choices":["国の財政を処理する権限は、国会の議決に基づいて行使される。","新たに租税を課す場合でも法律は不要である。","予算は最高裁判所が作成して国会へ提出する。","国費支出に国会の議決は一切不要である。","皇室財産は国会議決なしに自由に処分できる。"],"wordbank":"","points":4,"answers":["1"],"model":"","explanation":"憲法83条以下。財政民主主義、租税法律主義、予算の国会議決等が中心。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"標準","category":"薄出"},{"id":"MOCK3-07","mock":"mock3","no":7,"format":"5肢択一","section":"法令等","subject":"憲法","field":"憲法改正","stem":"憲法改正手続について、妥当なものはどれか。","choices":["各議院の総議員の過半数で発議できる。","各議院の総議員の3分の2以上の賛成で国会が発議し、国民投票等で過半数の賛成を要する。","国民投票は不要である。","内閣だけで憲法を改正できる。","最高裁判所の全員一致が改正要件である。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"憲法96条。各議院総議員の3分の2以上＋国民承認。","source":"https://laws.e-gov.go.jp/law/321CONSTITUTION","difficulty":"標準","category":"薄出"},{"id":"MOCK3-08","mock":"mock3","no":8,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政計画","stem":"行政計画に関する次の記述のうち、妥当なものはどれか。","choices":["行政計画には必ず同一の法的効果が認められる。","行政計画は法律上の根拠を要することが絶対にない。","行政計画には多様なものがあり、法的効果や司法審査のあり方は計画の根拠・内容に応じて異なる。","行政計画の変更はどのような場合も違法である。","計画決定はすべて直ちに取消訴訟の対象となる処分である。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"行政計画は法形式・法的効果が多様。計画変更でも信頼保護・裁量統制が問題となり得る。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-09","mock":"mock3","no":9,"format":"5肢択一","section":"法令等","subject":"行政法","field":"公物","stem":"公物に関する次の記述のうち、妥当なものはどれか。","choices":["公共用財産は私人が利用することを一切予定しない。","公共用財産としての形態・機能を完全に失っても、明示の公用廃止がなければ取得時効は絶対に成立しない。","道路・河川など公衆の用に供される物は、公物法上の規律の対象となり得る。","海は当然に私人の所有権の客体となる。","公物に関する紛争に民法が関係する余地は一切ない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"公物には公共用物等があり、取得時効・公用廃止などで判例論点がある。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"やや難","category":"長期空白"},{"id":"MOCK3-10","mock":"mock3","no":10,"format":"5肢択一","section":"法令等","subject":"行政法","field":"行政契約","stem":"行政契約に関する次の記述のうち、妥当なものはどれか。","choices":["行政主体が当事者となる契約には民法等の私法規定が適用される余地は一切ない。","地方公共団体の契約方式には地方自治法上の規律がある。","行政契約はすべて行政処分である。","公害防止協定は法律の明文根拠がなければ法的拘束力を持つ余地がない。","随意契約制限に違反すれば契約は必ず当然無効となる。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行政主体の契約にも私法規定が関係し得る一方、地方自治法等の公法上の特則がある。","source":"https://laws.e-gov.go.jp/law/322AC0000000067?occasion_date=20260401","difficulty":"標準","category":"長期空白"},{"id":"MOCK3-11","mock":"mock3","no":11,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"届出","stem":"行政手続法上の届出について、妥当なものはどれか。","choices":["届出は行政庁に許可を求める申請と同じである。","法令により届出が義務付けられ、形式上の要件に適合する届出書が提出先機関に到達したとき、届出義務は履行されたものとなる。","届出には行政庁の許可という応答が常に必要である。","届出はすべて事後届出に限られる。","必要添付書類がなくても常に届出義務は履行済みとなる。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行政手続法37条。形式上の要件に適合した届出は到達時に履行済み。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-12","mock":"mock3","no":12,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"処分等の求め","stem":"行政手続法上の「処分等の求め」について、妥当なものはどれか。","choices":["法令違反の事実があっても、何人も行政庁へ是正のための処分等を求める申出はできない。","法令違反の事実がある場合、権限を有する行政庁に処分または行政指導を求める申出制度がある。","申出があれば行政庁は必ず申出どおりの処分をしなければならない。","申出は行政事件訴訟でのみ行う。","申出制度は地方自治法にだけ規定される。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行政手続法36条の3。申出に対し行政庁は必要な調査をし、必要に応じ処分・行政指導を行う。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"やや難","category":"未出隣接"},{"id":"MOCK3-13","mock":"mock3","no":13,"format":"5肢択一","section":"法令等","subject":"行政手続法","field":"地方公共団体への適用","stem":"地方公共団体の機関がする処分・行政指導と行政手続法の適用について、妥当なものはどれか。","choices":["地方公共団体の機関がする行政指導には行政手続法が常に全面適用される。","条例または規則に根拠を置く地方公共団体の処分等の一定範囲について、行政手続法の直接適用が除外される。","法律に基づく地方公共団体の処分にも行政手続法は絶対に適用されない。","地方公共団体には行政手続条例を制定する余地がない。","地方公共団体の届出には行政手続法上の問題は一切生じない。"],"wordbank":"","points":4,"answers":["2"],"model":"","explanation":"行政手続法3条3項。地方公共団体には適用除外がある一方、法律根拠の処分等では適用関係が異なる。","source":"https://laws.e-gov.go.jp/law/405AC0000000088?occasion_date=20260401","difficulty":"やや難","category":"未出隣接"},{"id":"MOCK3-14","mock":"mock3","no":14,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"参加人・口頭意見陳述","stem":"審査請求の審理手続について、妥当なものはどれか。","choices":["利害関係人は審査請求に参加できない。","審査請求人または参加人から申立てがあっても口頭意見陳述の機会は与えられない。","審査請求人または参加人から申立てがあった場合、原則として口頭意見陳述の機会を与えなければならない。","口頭意見陳述では補佐人の同席は絶対に認められない。","参加人は意見書や証拠を提出できない。"],"wordbank":"","points":4,"answers":["3"],"model":"","explanation":"行審法31条。申立人には原則口頭意見陳述の機会を与える。","source":"https://laws.e-gov.go.jp/law/426AC0000000068?occasion_date=20260401","difficulty":"標準","category":"薄出"},{"id":"MOCK3-15","mock":"mock3","no":15,"format":"5肢択一","section":"法令等","subject":"行政不服審査法","field":"再審査請求","stem":"再審査請求について、妥当なものはどれか。","choices":["法律に定めがなくても、すべての裁決について再審査請求できる。","再審査請求は原裁決を知っ
