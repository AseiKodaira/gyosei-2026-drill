<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <title>Style-Bert-VITS2 6語発音ゲート</title>
  <style>
    :root{--navy:#17365d;--bg:#f5f7fb;--card:#fff;--line:#e4e8ef;--ink:#172033;--muted:#667085;--green:#138a53;--red:#b42318}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;padding-bottom:40px}
    main{max-width:720px;margin:0 auto;padding:18px 14px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{font-size:22px;margin:0}
    .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--navy);font-weight:800}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
    .lead{font-size:14px;line-height:1.7}
    .term-card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
    .term{font-size:21px;font-weight:900;color:var(--navy);margin-bottom:5px}
    .reading{font-size:13px;color:var(--muted);line-height:1.6}
    .meta{font-size:11px;color:var(--muted);line-height:1.6}
    .tag{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#eef3f8;color:var(--navy);font-size:10px;font-weight:800}
    button{border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-weight:850;min-height:46px;padding:10px 16px}
    .note{font-size:12px;line-height:1.7;color:var(--muted)}
    .ready{color:var(--green);font-weight:800}
    .status{font-size:12px;margin-top:8px}
    .judgment{grid-column:1/-1;border:0;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap}
    .judgment legend{font-size:13px;margin-bottom:8px}
    .judgment button{background:#eef3f8;color:var(--navy);font-size:13px}
    .judgment button[aria-pressed="true"]{background:var(--navy);color:#fff}
    button:disabled{opacity:.45}
    button:focus-visible,a:focus-visible{outline:3px solid #e89b00;outline-offset:3px}
    .error{color:var(--red)}
    details{grid-column:1/-1;font-size:12px;overflow-wrap:anywhere}
    @media(max-width:360px){.term-card{grid-template-columns:1fr}.term-card>button{justify-self:start}}
  </style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="./index.html">← 学習アプリへ</a>
    <span style="font-size:11px;color:#667085">発音ゲート</span>
  </div>

  <div class="card">
    <h1>Style-Bert-VITS2 6語発音ゲート</h1>
    <p class="lead">文章にも4拍にもまだしません。まず法律用語6語を単語単体で正しく発音できるかだけ確認します。</p>
    <p class="note">1語ずつ最後まで再生し、読み・長音・音の切れ方・アクセントを聞いて「OK」または「要修正」を選んでください。6語すべてがOKになるまで発音確認を続けます。判定はこの端末に保存します。</p>
    <div class="status" id="status" role="status">読み込み中…</div>
    <p class="status" id="gate" role="status"></p>
    <p class="note" id="storageStatus" role="status"></p>
  </div>

  <div id="terms"></div>

  <div class="card">
    <div class="note" id="engineMeta"></div>
    <p class="note">生成時の読み・音素・アクセント指定は各語の詳細で確認できます。指定どおりに聞こえるかは、試聴して判定してください。</p>
  </div>
</main>

<script>
'use strict';
const STORAGE_KEY='gyosei2026-sbv2-pronunciation-v1';
let active=null;
let items=[];
let judgments={};
let revision='';
let audioVersion='';
const heard=new Set();
const status=document.getElementById('status');

function stopAudio(){
  if(!active)return;
  const {audio,button}=active;
  active=null;
  audio.onended=null;
  audio.onerror=null;
  audio.pause();
  audio.currentTime=0;
  button.textContent='▶ 再生';
  button.setAttribute('aria-pressed','false');
}

function updateGate(){
  let ok=0,fix=0;
  items.forEach((item,i)=>{
    const value=judgments[item.term];
    if(value==='ok')ok++;
    if(value==='fix')fix++;
    document.querySelectorAll(`[data-judge="${i}"]`).forEach(button=>{
      button.disabled=!heard.has(i)&&!value;
      button.setAttribute('aria-pressed',String(button.dataset.value===value));
    });
  });
  document.getElementById('gate').textContent=
    `OK ${ok}/6語・要修正 ${fix}語・未判定 ${6-ok-fix}語。`+
    (ok===6?'6語の発音ゲートを通過しました。文章化・4拍化は次の段階です。':'まず6語の発音を確認してください。');
}

function saveJudgments(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify({revision,judgments}));
    document.getElementById('storageStatus').textContent='判定をこの端末に保存しました。';
  }catch(e){
    document.getElementById('storageStatus').textContent='この端末に保存できません。判定はページを閉じるまで有効です。';
  }
}

async function play(i,button){
  const same=active&&active.button===button;
  stopAudio();
  if(same){status.textContent='再生を停止しました。';return;}
  const item=items[i];
  const url=new URL(item.src,location.href);
  url.searchParams.set('v',audioVersion);
  const audio=new Audio(url.href);
  active={audio,button};
  button.textContent='■ 停止';
  button.setAttribute('aria-pressed','true');
  status.classList.remove('error');
  status.textContent=item.term+'を再生中…';
  const fail=()=>{
    if(!active||active.audio!==audio)return;
    stopAudio();
    status.classList.add('error');
    status.textContent=item.term+'の音声を再生できませんでした。通信を確認して、もう一度再生してください。';
  };
  audio.onended=()=>{
    if(!active||active.audio!==audio)return;
    stopAudio();
    heard.add(i);
    status.textContent=item.term+'の再生が終わりました。発音を判定してください。';
    updateGate();
  };
  audio.onerror=fail;
  try{await audio.play();}catch(e){fail();}
}

async function load(){
  try{
    const response=await fetch('./audio/sbv2-legal-terms/manifest.json',{cache:'no-store'});
    if(!response.ok)throw new Error('manifest');
    const m=await response.json();
    const expected=['不確定期限','履行請求','履行遅滞','物上代位','牽連性','瑕疵'];
    if(m.engine!=='Style-Bert-VITS2'||!Array.isArray(m.items)||m.items.length!==6||
      m.items.some((v,i)=>v.term!==expected[i]||typeof v.reading!=='string'||
        v.src!==`./audio/sbv2-legal-terms/term_0${i+1}.wav`))throw new Error('six terms');
    items=m.items;
    audioVersion=String(m.generatedAt||m.version);
    revision=JSON.stringify([m.version,m.generatedAt,m.model,m.items]);
    try{
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      if(saved&&saved.revision===revision&&saved.judgments){
        items.forEach(v=>{
          const value=saved.judgments[v.term];
          if(value==='ok'||value==='fix')judgments[v.term]=value;
        });
      }
    }catch(e){document.getElementById('storageStatus').textContent='保存済みの判定を読み込めませんでした。再判定できます。';}
    const terms=document.getElementById('terms');
    items.forEach((v,i)=>{
      const card=document.createElement('section');
      card.className='card term-card';
      card.innerHTML=`<div><div class="term"></div><div class="reading"></div></div>
        <button data-play="${i}" aria-pressed="false">▶ 再生</button>
        <fieldset class="judgment"><legend></legend>
          <button data-judge="${i}" data-value="ok" aria-pressed="false" disabled>OK</button>
          <button data-judge="${i}" data-value="fix" aria-pressed="false" disabled>要修正</button>
        </fieldset>
        <details><summary>生成時の指定を見る</summary><p class="meta"></p></details>`;
      card.querySelector('.term').textContent=`${i+1}. ${v.term}`;
      card.querySelector('.reading').textContent='読み：'+v.reading;
      card.querySelector('legend').textContent=v.term+'の判定（最後まで聞いてから選択）';
      card.querySelector('.meta').textContent='音素：'+(v.phones||[]).join(' ')+' ／ アクセント：'+(v.tones||[]).join(' ');
      const button=card.querySelector('[data-play]');
      button.setAttribute('aria-label',v.term+'を再生・停止');
      button.onclick=()=>play(i,button);
      card.querySelectorAll('[data-judge]').forEach(b=>{
        b.onclick=()=>{judgments[v.term]=b.dataset.value;saveJudgments();updateGate();};
      });
      terms.appendChild(card);
    });
    status.textContent='6語の音声を1語ずつ再生できます。';
    updateGate();
    document.getElementById('engineMeta').textContent=
      'エンジン：'+m.engine+' ／ モデル：'+(m.model||'')+
      ' ／ モデルライセンス：'+(m.modelLicense||'')+' ／ 音声生成日時：'+(m.generatedAt||'');
  }catch(e){
    status.classList.add('error');
    status.textContent='6語の発音テストデータを読み込めませんでした。通信を確認して再読み込みしてください。';
  }
}
window.addEventListener('pagehide',stopAudio);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});
load();
</script>
</body>
</html>
