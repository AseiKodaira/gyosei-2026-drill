name: Generate AI mnemonic audio

on:
  workflow_dispatch:
    inputs:
      max_new:
        description: "Maximum number of new audio files to generate (0 = all missing)"
        required: false
        default: "0"
      force:
        description: "Regenerate audio files that already exist"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-ai-mnemonic-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not configured."
            exit 1
          fi

      - name: Generate natural mnemonic audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAP_MODEL: "gpt-4o-mini-tts-2025-12-15"
          RAP_VOICE: "marin"
          RAP_MAX_NEW: ${{ inputs.max_new }}
          RAP_FORCE: ${{ inputs.force }}
        run: node scripts/generate-rap-audio.mjs

      - name: Commit generated audio
        run: |
          if git diff --quiet -- audio/rap && [ -z "$(git status --porcelain --untracked-files=all audio/rap)" ]; then
            echo "No audio changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/rap
          git commit -m "chore: generate natural mnemonic audio"
          git push
